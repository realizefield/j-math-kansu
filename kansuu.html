<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>関数　座標・正比例・一次関数・反比例 | 江原予備校 GAMBA</title>
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#2b2b2b; --sub:#666; --main:#1f6f5c; --main-d:#14503f;
  --accent:#e07a1f; --point:#fff6e0; --line:#d9d4c5; --ok:#1f8a4c; --ng:#c0392b; --soft:#e8f3ef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;line-height:1.9;font-size:17px}
header{background:var(--main);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:1.35rem}
header p{margin:4px 0 0;font-size:.9rem;opacity:.9}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 4px;max-width:900px;margin:0 auto}
nav button{border:1px solid var(--main);background:#fff;color:var(--main);border-radius:20px;padding:6px 12px;font-size:.88rem;cursor:pointer}
nav button.on{background:var(--main);color:#fff}
main{max-width:900px;margin:0 auto;padding:8px 12px 60px}
h2.unit{font-size:1.4rem;border-left:8px solid var(--main);padding-left:10px;margin:18px 0 6px}
h3.sec{background:var(--soft);color:var(--main-d);padding:6px 12px;border-radius:6px;font-size:1.1rem;margin:30px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.point{background:var(--point);border:2px solid var(--accent);border-radius:10px;padding:12px 16px;margin:10px 0}
.point b.t{display:inline-block;background:var(--accent);color:#fff;padding:0 10px;border-radius:4px;margin-bottom:6px}
.point div{margin:4px 0}
.imp{border:2px solid var(--main);border-radius:8px;padding:6px 14px;margin:10px 0;background:#f4faf8}
table.t{border-collapse:collapse;margin:8px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid #bbb;padding:3px 12px;text-align:center}
table.t th{background:#efefe6}
.fr{display:inline-block;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px}
.fr>span{display:block;padding:0 2px}
.fr>span:first-child{border-bottom:1px solid currentColor}
svg.graph{width:100%;max-width:360px;display:block;margin:8px auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.cap{text-align:center;font-size:.85rem;color:var(--sub);margin-top:-4px}
.ex{background:#fff;border:2px solid var(--main);border-radius:10px;padding:12px 16px;margin:14px 0}
.ex .q{font-weight:bold}
.ex .tag{display:inline-block;background:var(--main);color:#fff;border-radius:4px;padding:0 10px;margin-right:6px}
.step{border-left:5px solid var(--accent);background:#fffaf0;margin:10px 0;padding:6px 12px;border-radius:0 8px 8px 0;animation:in .35s}
.step .badge{font-weight:bold;color:var(--accent);margin-right:6px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{background:var(--main);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:1rem;cursor:pointer;margin-top:6px}
.btn:hover{background:var(--main-d)}
.btn.sub{background:#fff;color:var(--main);border:1px solid var(--main)}
.prog{font-size:.85rem;color:var(--sub);margin-left:8px}
.quiz{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}
.quiz .qn{font-weight:bold}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opts button{border:2px solid #cfcab9;background:#fcfcf8;border-radius:8px;padding:8px 10px;font-size:1rem;cursor:pointer;text-align:left}
.opts button.gr{text-align:center}
.opts button svg.graph{max-width:190px;margin:2px auto 4px}
.opts button:hover:not(:disabled){border-color:var(--main)}
.opts button.ok{border-color:var(--ok);background:#e6f6ec}
.opts button.ng{border-color:var(--ng);background:#fdeaea}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;background:#f1f1ea;display:none}
.fb.show{display:block;animation:in .3s}
.score{font-weight:bold;font-size:1.1rem;color:var(--main-d);background:var(--soft);padding:10px 14px;border-radius:8px;margin:10px 0;display:none}
.pager{display:flex;justify-content:space-between;margin-top:30px}

.subq{margin:14px 0 4px;padding:4px 12px;border-left:6px solid var(--accent);background:#fff8e8;font-size:1rem;border-radius:0 8px 8px 0}
.g-big{margin:26px 0 4px;padding:8px 14px;background:#14503f;color:#fff;font-size:18px;font-weight:bold;border-radius:8px;letter-spacing:.1em}
.g-sec{font-size:1.05rem;font-weight:bold;color:var(--main-d);border-left:5px solid var(--main);padding-left:10px;margin:26px 0 10px}
.u-list{display:flex;flex-direction:column;gap:8px}
.u-card{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;font-size:1rem;color:var(--ink);width:100%}
.u-card:hover{border-color:var(--main);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.u-no{background:var(--main);color:#fff;font-weight:bold;border-radius:8px;min-width:2.3em;text-align:center;padding:2px 6px;flex-shrink:0}
.u-name{flex:1;font-weight:bold;line-height:1.45}
.u-sub{display:block;font-size:.82rem;font-weight:normal;color:var(--sub);margin-top:2px}
.u-go{color:#b9b5a6;font-size:1.1rem}
.top-btn{margin:12px 0 0}
.notice{background:var(--soft);border:1.5px solid var(--main);border-radius:10px;padding:10px 14px;margin:14px 0;font-size:.95rem;line-height:1.8}
.confetti-piece{position:fixed;top:-20px;opacity:0;animation:confettiFall linear forwards;pointer-events:none;z-index:9999}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}80%{opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.u-badge{font-size:.75rem;font-weight:bold;padding:2px 9px;border-radius:10px;white-space:nowrap;background:#dcfce7;color:#15803d;border:1px solid #86efac;flex-shrink:0}
.u-card.pass{background:#f0fdf4;border-color:#86efac}
.dyn{border:2px dashed var(--accent);border-radius:10px;padding:8px 10px;margin:10px 0;background:#fffdf6}
.dyn-title{font-weight:bold;color:var(--accent);margin-bottom:4px}
.dyn-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dyn-fig,.dyn-gr{flex:1 1 300px;min-width:0}
.dyn input[type=range]{width:100%;margin:6px 0}
.dyn-info{font-size:1.05rem}
.dyn-note{background:#fff;border-left:5px solid var(--accent);padding:4px 10px;margin:6px 0;border-radius:0 8px 8px 0}
.dyn-btns{margin:4px 0}
.dyn-times{margin-top:6px}.dyn-times span{font-size:.9rem;color:var(--sub);margin-right:4px}
.dyn-times .btn{padding:4px 10px;font-size:.9rem;margin:2px}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:20px}
</style>
</head>
<body>
<header>
  <h1>関数　座標・正比例・一次関数・反比例</h1>
  <p>江原予備校 GAMBA　／　ひとつずつ、ゆっくり進めましょう。わからないところは、何度でも「ステップ」を見直してください。</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>© 江原予備校　GAMBAシステム</footer>

<script>
/* ---------- 表示用ユーティリティ ---------- */
function fmt(s){ return s.replace(/\{([^{}\/]+)\/([^{}\/]+)\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>'); }
function N(v){ return String(v).replace('-','−'); }
function T(xs,ys){
  return '<table class="t"><tr><th>x</th>'+xs.map(function(v){return '<td>'+N(v)+'</td>';}).join('')+'</tr><tr><th>y</th>'+ys.map(function(v){return '<td>'+N(v)+'</td>';}).join('')+'</tr></table>';
}
function P(xs,ys){ return xs.map(function(x,i){return [x,ys[i]];}); }

/* ---------- グラフ描画 ---------- */
function graph(o){
  if(o&&o.tg) return tgraph(o);
  o=Object.assign({},o);
  var arr0=(o.arr||[]).map(function(a){
    var l=a.l;
    if(l!=null && /^\d+$/.test(String(l))){
      var hz=(a.f[1]===a.t[1]);
      l=hz?((a.t[0]>a.f[0])?'右へ':'左へ')+l:((a.t[1]>a.f[1])?'上へ':'下へ')+l;
    }
    return {f:a.f,t:a.t,l:l,c:a.c};
  });
  (o.tri||[]).forEach(function(t){
    var x=t.f[0], y=t.f[1];
    arr0.push({f:[x,y],t:[x+t.dx,y],l:(t.dx>0?'右へ':'左へ')+Math.abs(t.dx),c:t.c1});
    arr0.push({f:[x+t.dx,y],t:[x+t.dx,y+t.dy],l:(t.dy>0?'上へ':'下へ')+Math.abs(t.dy),c:t.c2||'#c0392b'});
  });
  o.arr=arr0;
  var R=o.R||6, S=360, u=S/(2*R+2), c=S/2;
  var X=function(x){return c+x*u}, Y=function(y){return c-y*u};
  var s='<svg class="graph" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">';
  var i;
  for(i=-R;i<=R;i++){
    s+='<line x1="'+X(i)+'" y1="0" x2="'+X(i)+'" y2="360" stroke="#e4e4dc" stroke-width="1"/>';
    s+='<line x1="0" y1="'+Y(i)+'" x2="360" y2="'+Y(i)+'" stroke="#e4e4dc" stroke-width="1"/>';
  }
  s+='<line x1="0" y1="'+c+'" x2="360" y2="'+c+'" stroke="#333" stroke-width="1.6"/>';
  s+='<line x1="'+c+'" y1="0" x2="'+c+'" y2="360" stroke="#333" stroke-width="1.6"/>';
  s+='<text x="352" y="'+(c-6)+'" font-size="14" font-style="italic" text-anchor="end">x</text>';
  s+='<text x="'+(c+7)+'" y="15" font-size="14" font-style="italic">y</text>';
  s+='<text x="'+(c-13)+'" y="'+(c+15)+'" font-size="12">O</text>';
  if(!o.mini){
    for(i=-R;i<=R;i++){
      if(i===0) continue;
      s+='<text x="'+X(i)+'" y="'+(c+13)+'" font-size="10" fill="#555" text-anchor="middle">'+N(i)+'</text>';
      s+='<text x="'+(c-4)+'" y="'+(Y(i)+3.5)+'" font-size="10" fill="#555" text-anchor="end">'+N(i)+'</text>';
    }
  }
  (o.lines||[]).forEach(function(ln){
    var a=ln.a, b=ln.b||0, x1=-R-1, x2=R+1;
    s+='<line x1="'+X(x1)+'" y1="'+Y(a*x1+b)+'" x2="'+X(x2)+'" y2="'+Y(a*x2+b)+'" stroke="'+(ln.c||'#d4561f')+'" stroke-width="2.4"/>';
    if(ln.l){
      var xl=R-0.4, k=0;
      while(k<200 && (Math.abs(a*xl+b)>R-0.7) && xl>-R){ xl-=0.1; k++; }
      var px=X(xl), py=Y(a*xl+b);
      s+='<text x="'+(px-4)+'" y="'+(py+(a>0?16:-8))+'" font-size="13" fill="'+(ln.c||'#d4561f')+'" text-anchor="end" font-weight="bold">'+ln.l+'</text>';
    }
  });
  (o.rect||[]).forEach(function(r){
    var col=r.c||'#e07a1f', px=X(r.p[0]), py=Y(r.p[1]), w=Math.abs(px-c), hh=Math.abs(py-c);
    s+='<rect x="'+Math.min(px,c)+'" y="'+Math.min(py,c)+'" width="'+w+'" height="'+hh+'" fill="'+col+'" fill-opacity="0.18" stroke="'+col+'" stroke-width="2" stroke-dasharray="5 3"/>';
    if(r.l) s+='<text x="'+((px+c)/2)+'" y="'+((py+c)/2+4)+'" font-size="13" font-weight="bold" fill="'+col+'" text-anchor="middle">'+r.l+'</text>';
  });
  (o.hyp||[]).forEach(function(hp){
    var a=hp.a, col=hp.c||'#d4561f', lim=R+1, x0=Math.max(Math.abs(a)/lim,0.05), d1='', d2='', k, x, st=0.05, n=Math.floor((R+1-x0)/st);
    for(k=0;k<=n;k++){ x=x0+k*st; d1+=(k?'L':'M')+X(x)+','+Y(a/x); d2+=(k?'L':'M')+X(-x)+','+Y(-a/x); }
    s+='<path d="'+d1+'" fill="none" stroke="'+col+'" stroke-width="2.4"/><path d="'+d2+'" fill="none" stroke="'+col+'" stroke-width="2.4"/>';
    if(hp.l) s+='<text x="'+X(R*0.55)+'" y="'+(Y(a/(R*0.55))+(a>0?-8:16))+'" font-size="13" font-weight="bold" fill="'+col+'">'+hp.l+'</text>';
  });
  (o.arr||[]).forEach(function(a){
    var col=a.c||'#2a6fb0';
    var x1=X(a.f[0]), y1=Y(a.f[1]), x2=X(a.t[0]), y2=Y(a.t[1]);
    var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy), ux=dx/L, uy=dy/L, hs=10;
    s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+(x2-ux*hs*0.7)+'" y2="'+(y2-uy*hs*0.7)+'" stroke="'+col+'" stroke-width="3"/>';
    s+='<polygon points="'+x2+','+y2+' '+(x2-ux*hs+uy*hs*0.5)+','+(y2-uy*hs-ux*hs*0.5)+' '+(x2-ux*hs-uy*hs*0.5)+','+(y2-uy*hs+ux*hs*0.5)+'" fill="'+col+'"/>';
    if(a.l){
      var mx=(x1+x2)/2, my=(y1+y2)/2, horiz=Math.abs(dx)>Math.abs(dy);
      s+='<text x="'+(horiz?mx:mx+9)+'" y="'+(horiz?my+18:my+5)+'" font-size="14" font-weight="bold" fill="'+col+'" stroke="#fff" stroke-width="3" paint-order="stroke" text-anchor="'+(horiz?'middle':'start')+'">'+a.l+'</text>';
    }
  });
  (o.pts||[]).forEach(function(p){
    s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4.6" fill="#1f6f5c" stroke="#fff" stroke-width="1.2"/>';
    var dup=(o.ic||[]).some(function(q){return q[0]===p[0]&&q[1]===p[1];});
    if(p[2]&&!dup) s+='<text x="'+(X(p[0])+7)+'" y="'+(Y(p[1])-7)+'" font-size="12.5" fill="#14503f" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">'+p[2]+'</text>';
  });
  (o.ic||[]).forEach(function(p){
    s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="7" fill="#e07a1f" stroke="#fff" stroke-width="1.8"/>';
    if(p[2]) s+='<text x="'+(X(p[0])+10)+'" y="'+(Y(p[1])-9)+'" font-size="13" fill="#a8480a" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">'+p[2]+'</text>';
  });
  (o.txt||[]).forEach(function(t){
    s+='<text x="'+X(t.x)+'" y="'+Y(t.y)+'" font-size="'+(t.s||15)+'" font-weight="bold" fill="'+(t.c||'#d4561f')+'">'+t.t+'</text>';
  });
  return s+'</svg>';
}
/* ---------- 速さ・動点用グラフ（横軸と縦軸の目もりがちがう） ---------- */
function tgraph(o){
  var W=380,H=300,L=64,Bm=46,T=18,Rm=24,pw=W-L-Rm,ph=H-Bm-T;
  var X=function(x){return L+x/o.xmax*pw}, Y=function(y){return H-Bm-y/o.ymax*ph};
  var tk=function(v){return String(Math.round(v*100)/100);};
  var s='<svg class="graph" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  var v;
  for(v=0;v<=o.xmax+1e-9;v+=o.xs){
    s+='<line x1="'+X(v)+'" y1="'+Y(0)+'" x2="'+X(v)+'" y2="'+Y(o.ymax)+'" stroke="#e4e4dc" stroke-width="1"/>';
    s+='<text x="'+X(v)+'" y="'+(H-Bm+16)+'" font-size="11" fill="#555" text-anchor="middle">'+tk(v)+'</text>';
  }
  for(v=0;v<=o.ymax+1e-9;v+=o.ys){
    s+='<line x1="'+X(0)+'" y1="'+Y(v)+'" x2="'+X(o.xmax)+'" y2="'+Y(v)+'" stroke="#e4e4dc" stroke-width="1"/>';
    s+='<text x="'+(L-6)+'" y="'+(Y(v)+4)+'" font-size="11" fill="#555" text-anchor="end">'+tk(v)+'</text>';
  }
  s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+(W-Rm+6)+'" y2="'+Y(0)+'" stroke="#333" stroke-width="1.6"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+(T-6)+'" stroke="#333" stroke-width="1.6"/>';
  if(o.xl) s+='<text x="'+(W-Rm)+'" y="'+(H-6)+'" font-size="12" fill="#333" text-anchor="end">'+o.xl+'</text>';
  if(o.yl) s+='<text x="'+(L+4)+'" y="12" font-size="12" fill="#333">'+o.yl+'</text>';
  (o.segs||[]).forEach(function(sg){
    var d='';
    sg.p.forEach(function(p,i){ d+=(i?'L':'M')+X(p[0])+','+Y(p[1]); });
    s+='<path d="'+d+'" fill="none" stroke="'+(sg.c||'#d4561f')+'" stroke-width="'+(sg.w||2.8)+'"'+(sg.dash?' stroke-dasharray="6 5"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
  });
  (o.guides||[]).forEach(function(g){
    s+='<line x1="'+X(g[0])+'" y1="'+Y(g[1])+'" x2="'+X(g[0])+'" y2="'+Y(0)+'" stroke="#e07a1f" stroke-width="1.4" stroke-dasharray="4 3"/>';
    s+='<line x1="'+X(g[0])+'" y1="'+Y(g[1])+'" x2="'+X(0)+'" y2="'+Y(g[1])+'" stroke="#e07a1f" stroke-width="1.4" stroke-dasharray="4 3"/>';
    s+='<text x="'+X(g[0])+'" y="'+(H-Bm+30)+'" font-size="12" fill="#a8480a" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">'+tk(g[0])+'</text>';
    s+='<text x="'+(L-6)+'" y="'+(Y(g[1])+4)+'" font-size="12" fill="#a8480a" font-weight="bold" text-anchor="end" stroke="#fff" stroke-width="3" paint-order="stroke">'+tk(g[1])+'</text>';
  });
  (o.tri||[]).forEach(function(t){
    var x1=X(t.f[0]),y1=Y(t.f[1]),x2=X(t.t[0]),y2=Y(t.t[1]),hs=9;
    var segs=[[x1,y1,x2,y1,'#2a6fb0'],[x2,y1,x2,y2,'#c0392b']];
    segs.forEach(function(a){
      var dx=a[2]-a[0],dy=a[3]-a[1],Ln=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/Ln,uy=dy/Ln;
      s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+(a[2]-ux*hs*0.7)+'" y2="'+(a[3]-uy*hs*0.7)+'" stroke="'+a[4]+'" stroke-width="3"/>';
      s+='<polygon points="'+a[2]+','+a[3]+' '+(a[2]-ux*hs+uy*hs*0.5)+','+(a[3]-uy*hs-ux*hs*0.5)+' '+(a[2]-ux*hs-uy*hs*0.5)+','+(a[3]-uy*hs+ux*hs*0.5)+'" fill="'+a[4]+'"/>';
    });
    if(t.lx) s+='<text x="'+((x1+x2)/2)+'" y="'+(y1+17)+'" font-size="13" font-weight="bold" fill="#2a6fb0" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">'+t.lx+'</text>';
    if(t.ly) s+='<text x="'+(x2+8)+'" y="'+((y1+y2)/2+5)+'" font-size="13" font-weight="bold" fill="#c0392b" stroke="#fff" stroke-width="3" paint-order="stroke">'+t.ly+'</text>';
  });
  var lab=function(px,py,txt,col,fs){
    var right=px>W-110;
    return '<text x="'+(right?px-9:px+9)+'" y="'+(py-9)+'" font-size="'+(fs||12.5)+'" font-weight="bold" fill="'+col+'" text-anchor="'+(right?'end':'start')+'" stroke="#fff" stroke-width="3" paint-order="stroke">'+txt+'</text>';
  };
  (o.pts||[]).forEach(function(p){
    if(p[4]==='open') s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5.5" fill="#fff" stroke="'+(p[3]||'#1f6f5c')+'" stroke-width="2.4"/>';
    else s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5" fill="'+(p[3]||'#1f6f5c')+'" stroke="#fff" stroke-width="1.3"/>';
    if(p[2]) s+=lab(X(p[0]),Y(p[1]),p[2],'#14503f');
  });
  (o.ic||[]).forEach(function(p){
    s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="7" fill="#e07a1f" stroke="#fff" stroke-width="1.8"/>';
    if(p[2]) s+=lab(X(p[0]),Y(p[1]),p[2],'#a8480a',13);

/* ===== 共通の小道具（図・式の文字列） ===== */
function cl(o){return JSON.parse(JSON.stringify(o));}
function NS(v){return (v<0?'−':'')+Math.abs(v);}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function eqLine(n,d){var s=n<0?'−':'',an=Math.abs(n);if(d===1)return 'y ＝ '+s+(an===1?'':an)+'x';return 'y ＝ '+s+'{'+an+'/'+d+'}x';}
function eqHyp(k){return 'y ＝ '+(k<0?'−':'')+'{'+Math.abs(k)+'/x}';}
function PT(p){return '('+NS(p[0])+', '+NS(p[1])+')';}
function uniq4(c){var r=[];c.forEach(function(x){if(r.indexOf(x)<0&&r.length<4)r.push(x);});return r;}

/* ================= 正比例と反比例のグラフ（原点について対称な点） ================= */
function symBase(px,py){var k=px*py,a=py/px,R=Math.max(5,Math.abs(px)+1,Math.abs(py)+1);return {R:R,lines:[{a:a,b:0,l:'①',c:'#2a6fb0'}],hyp:[{a:k,l:'②'}]};}
function symG(px,py,st){
  var g=symBase(px,py),k=px*py,A='A'+PT([px,py]),B='B'+PT([-px,-py]);
  if(st===0) g.pts=[[px,py,A]];
  if(st===0.5){g.pts=[[px,py,A],[0,0]];g.arr=[{f:[px,py],t:[0,0],c:'#8e44ad'}];}
  if(st===1||st==='e'){g.pts=[[px,py,A],[-px,-py,B],[0,0]];g.arr=[{f:[px,py],t:[0,0],c:'#8e44ad'},{f:[0,0],t:[-px,-py],c:'#8e44ad'}];}
  if(st===2){g.pts=[[px,py,A]];g.rect=[{p:[px,py],l:'面積 '+Math.abs(k)}];}
  if(st===3){g.pts=[[px,py,A],[-px,-py,B]];g.tri=[{f:[0,0],dx:Math.abs(px),dy:(px>0?py:-py)}];}
  if(st===4){g.pts=[[px,py,A],[-px,-py,B]];g.rect=[{p:[px,py],l:'面積 '+Math.abs(k)}];g.tri=[{f:[0,0],dx:Math.abs(px),dy:(px>0?py:-py)}];}
  return g;
}
function symEx(px,py){
  var k=px*py,sx=px>0?1:-1,n=py*sx/gcd(px,py),d=Math.abs(px)/gcd(px,py);
  var Bt=PT([-px,-py]),At=PT([px,py]);
  return {
   q:'図のように、正比例のグラフ①と反比例のグラフ②が、2点A、Bで交わっています。点Aの座標は '+At+' です。<br>(1)　点Bの座標を求めなさい。<br>(2)　②の式（反比例）を求めなさい。<br>(3)　①の式（正比例）を求めなさい。',
   g:symG(px,py,0),
   steps:[
    {t:'<b>ヒント：</b>正比例のグラフ（原点を通る直線）も、反比例のグラフも、<b>原点について対称</b>です。点Aから原点Oまで進み、<b>同じだけ先まで進んだ点</b>がBです。',g:symG(px,py,0.5)},
    {t:'<b>(1) 点Bの座標</b>：A '+At+' の x座標・y座標の<b>符号を両方ともかえる</b>と、原点について対称な点になります。<br>Aから原点まで「'+(px>0?'左へ ':'右へ ')+Math.abs(px)+'、'+(py>0?'下へ ':'上へ ')+Math.abs(py)+'」進んだので、さらに同じだけ進みます。<br><b>B '+Bt+'</b>',g:symG(px,py,1)},
    {t:'<b>(2) ②の式</b>：反比例は <b>x × y ＝ a</b>。Aの座標を使います。<br>a ＝ '+NS(px)+' × '+(py<0?'('+NS(py)+')':py)+' ＝ '+NS(k)+'<br>図の長方形の面積は '+Math.abs(k)+'（aの符号をとった数）で、グラフは'+(k>0?'第1・第3':'第2・第4')+'象限なので、a は'+(k>0?'プラス':'マイナス')+'です。<br><b>'+eqHyp(k)+'</b>',g:symG(px,py,2)},
    {t:'<b>(3) ①の式</b>：原点を通る直線なので y ＝ ax。右へ '+Math.abs(px)+' 進むと、'+((px>0?py:-py)>0?'上へ ':'下へ ')+Math.abs(py)+' 進む点（'+(px>0?'A':'B')+'）を通ります。傾き ＝ {'+NS(px>0?py:-py)+'/'+Math.abs(px)+'}'+(d===1&&gcd(px,py)===Math.abs(px)?'':'（約分して {'+NS(n)+'/'+d+'}）')+'。<br><b>'+eqLine(n,d)+'</b>',g:symG(px,py,3)},
    {t:'<b>答え：</b>(1) B '+Bt+'　(2) '+eqHyp(k)+'　(3) '+eqLine(n,d),g:symG(px,py,4)}
   ]};
}
function symQ(kind,px,py){
  var k=px*py,sx=px>0?1:-1,g0=gcd(px,py),n=py*sx/g0,d=Math.abs(px)/g0,o,e,eg,qq;
  var head='図のように、正比例のグラフ①と反比例のグラフ②が、2点A、Bで交わっています。点Aの座標は '+PT([px,py])+' です。';
  if(kind==='B'){
    qq=head+'点Bの座標は？';
    o=[PT([-px,-py]),PT([-px,py]),PT([px,-py]),PT([py,px])];
    e='Bは、Aと原点について対称な点です。x座標・y座標の<b>符号を両方ともかえて</b> <b>B '+PT([-px,-py])+'</b>。';eg=symG(px,py,'e');
  } else if(kind==='H'){
    qq=head+'②の式は？';
    o=uniq4([eqHyp(k),eqHyp(-k),eqLine(n,d),eqHyp(px+py||7),eqHyp(2*k)]);
    e='反比例は x × y ＝ a。a ＝ '+NS(px)+' × '+(py<0?'('+NS(py)+')':py)+' ＝ '+NS(k)+'。→ <b>'+eqHyp(k)+'</b>';eg=symG(px,py,2);
  } else {
    qq=head+'①の式は？';
    o=uniq4([eqLine(n,d),eqLine(-n,d),eqLine(d*(n<0?-1:1),Math.abs(n)),eqHyp(k),eqLine(2*n,d)]);
    e='①は原点を通る直線なので y ＝ ax。右へ '+Math.abs(px)+' 進むと '+NS(px>0?py:-py)+' だけ上がる（下がる）ので、傾きは {'+NS(n)+'/'+d+'}。→ <b>'+eqLine(n,d)+'</b>';eg=symG(px,py,3);
  }
  return {q:qq,g:symG(px,py,0),eg:eg,o:o,a:0,e:e};
}

function divsOf(n){n=Math.abs(n);var r=[];for(var i=1;i<=n;i++)if(n%i===0)r.push(i);return r;}
function intPts(k,sign){ /* sign: 1=x>0側, -1=x<0側, 0=両方 */
  var r=[];divsOf(k).forEach(function(d){var y=k/d;if(sign>=0)r.push([d,y]);if(sign<=0)r.push([-d,-y]);});return r;}

  var nr=ds.map(function(d){return '('+NS(-d)+', '+NS(-k/d)+')';}).join('、');
  var pos=intPts(k,1),neg=intPts(k,-1),all=intPts(k,0);
  var ak=Math.abs(k),lst=ds.join('、');

   {t:'<b>ヒント：</b>x も y も整数になる点では、<b>x × y ＝ '+k+'</b> を、整数どうしのかけ算で作ることになります。まず '+ak+' の約数（'+ak+' をわり切れる数）に注目します。',g:cntG(k,null,mini)},

   {t:'<b>② x ＞ 0 の側</b>：x を約数にすると、y ＝ '+k+' ÷ x も整数になります。<br>'+pr+'<br>→ '+n+'個',g:cntG(k,pos,mini)},

}

/* ================= 図の自動追加（傾き・切片をグラフ上に出す） ================= */
function parseEq(s){
  s=String(s).replace(/<[^>]*>/g,'').replace(/[ 　]/g,'').replace(/＝/g,'=').replace(/−/g,'-').replace(/＋/g,'+');
  var m=s.match(/y=(.*)$/); if(!m) return null;
  var r=m[1].replace(/（.*$/,'');
  var mm=r.match(/^([+-]?)(?:\{(\d+)\/(\d+)\}|(\d+))?x(?:([+-])(?:\{(\d+)\/(\d+)\}|(\d+)))?$/);
  if(!mm) return null;
  var sg=mm[1]==='-'?-1:1, p,q;
  if(mm[2]){p=+mm[2];q=+mm[3];} else if(mm[4]){p=+mm[4];q=1;} else {p=1;q=1;}
  p*=sg;
  var b=0;
  if(mm[5]){ var bs=mm[5]==='-'?-1:1; b=mm[6]?bs*(+mm[6])/(+mm[7]):bs*(+mm[8]); }
  var bi=Math.abs(b-Math.round(b))<1e-9; if(bi) b=Math.round(b);
  return {a:p/q,p:p,q:q,b:b,bi:bi};
}
function parsePts(q){
  var t=String(q).replace(/<[^>]*>/g,'').replace(/−/g,'-'),r=[],m,re=/\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)/g;
  while((m=re.exec(t))) r.push([+m[1],+m[2]]);
  if(r.length) return r;
  re=/x\s*＝\s*(-?\d+)\s*のとき\s*y\s*＝\s*(-?\d+)/g;
  while((m=re.exec(t))) r.push([+m[1],+m[2]]);
  return r;
}
function specFromPts(P){
  var p0=P[0],p1=P[1]; if(p1[0]<p0[0]){var t=p0;p0=p1;p1=t;}
  var dx=p1[0]-p0[0],dy=p1[1]-p0[1]; if(dx===0) return null;
  var g=gcd(dx,dy),a=dy/dx,b=p0[1]-a*p0[0],bi=Math.abs(b-Math.round(b))<1e-9; if(bi) b=Math.round(b);
  return {a:a,b:b,bi:bi,p:dy/g,q:dx/g,P:[p0,p1]};
}
/* f: line, tri, ic, pts, htri / base: 平行な直線（あれば） */
function figCore(sp,P,f,base){
  if(!sp) return null;
  var ext=1,tri=null,sP=null;
  P.forEach(function(p){ext=Math.max(ext,Math.abs(p[0]),Math.abs(p[1]));});
  if(sp.bi) ext=Math.max(ext,Math.abs(sp.b));
  if(base&&base.bi) ext=Math.max(ext,Math.abs(base.b));
  if(P.length>=2){ sP=specFromPts(P.slice(0,2)); if(sP) tri={f:sP.P[0],dx:sP.P[1][0]-sP.P[0][0],dy:sP.P[1][1]-sP.P[0][1]}; }
  else if(sp.bi&&sp.q<=6&&Math.abs(sp.p)<=8) tri={f:[0,sp.b],dx:sp.q,dy:sp.p};
  else if(P.length===1&&sp.q<=6) tri={f:P[0],dx:sp.q,dy:sp.p};
  if(tri) ext=Math.max(ext,Math.abs(tri.f[0]+tri.dx),Math.abs(tri.f[1]+tri.dy),Math.abs(tri.f[0]),Math.abs(tri.f[1]));
  var R=Math.max(4,Math.ceil(ext)+1); if(R>12) return null;
  var g={R:R,lines:[],pts:[],ic:[],arr:[]};
  if(base){ g.lines.push({a:base.a,b:base.b,c:'#2a6fb0'}); if(f.line===undefined) {} }
  if(f.line) g.lines.push({a:sp.a,b:sp.b});
  var hasIc=f.ic&&sp.bi;
  if(f.pts) P.forEach(function(p){ if(hasIc&&p[0]===0&&p[1]===sp.b) return; g.pts.push([p[0],p[1],PT(p)]); });
  if(f.tri&&tri) g.tri=[tri];
  if(f.htri&&tri){ g.arr.push({f:tri.f,t:[tri.f[0]+tri.dx,tri.f[1]],l:'右へ'+tri.dx}); }
  if(hasIc) g.ic=[[0,sp.b,'切片 (0, '+NS(sp.b)+')']];
  return g;
}
function hintSlope(e){ /* 傾きだけを見せる（原点から） */

}

  s.arr=[];s.pts=P;return s;

function dynWidget(cfg){
  var V={A:[0,cfg.H],B:[0,0],C:[cfg.W,0],D:[cfg.W,cfg.H]};
  var path=cfg.path.map(function(n){return V[n];});
  var cum=[0],i;
  for(i=1;i<path.length;i++){ cum.push(cum[i-1]+Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1])); }
  var total=cum[cum.length-1], times=cum.map(function(c){return c/cfg.v;}), xmax=total/cfg.v;
  var nseg=cfg.path.length-1;
  function pos(x){
    var d=Math.min(Math.max(cfg.v*x,0),total);
    for(var k=1;k<cum.length;k++){
      if(d<=cum[k]+1e-9){ var t=(d-cum[k-1])/(cum[k]-cum[k-1]); return {p:[path[k-1][0]+(path[k][0]-path[k-1][0])*t,path[k-1][1]+(path[k][1]-path[k-1][1])*t],seg:k-1}; }
    }

  }
  function segOf(x){ if(!cfg.poly) return pos(x).seg; var s=0; for(var k=0;k<nseg;k++){ if(times[k]<=x+1e-9) s=k; } return s; }
  function shape(sg,P){
    if(cfg.poly) return cfg.poly(sg,P);
    return cfg.tri.map(function(n){return n==='P'?P:V[n];});
  }
  function shoe(q){ var s=0,n=q.length; for(var k=0;k<n;k++){ var a=q[k],b=q[(k+1)%n]; s+=a[0]*b[1]-b[0]*a[1]; } return Math.abs(s)/2; }

  function area(x){ return areaAt(x,segOf(x)); }
  var SEG=[]; for(i=0;i<nseg;i++){ SEG.push([[times[i],areaAt(times[i],i)],[times[i+1],areaAt(times[i+1],i)]]); }
  var BP=[]; SEG.forEach(function(s,k){ if(k===0) BP.push(s[0]); BP.push(s[1]); });
  var jumps=[]; for(i=0;i<nseg-1;i++){ jumps.push(Math.abs(SEG[i][1][1]-SEG[i+1][0][1])>1e-6); }
  var root=document.createElement('div'); root.className='dyn';
  root.innerHTML='<div class="dyn-title">▼ スライダーを動かして、点Pの動きと面積の変わり方を見てみましょう</div>'+
   '<div class="dyn-grid"><div class="dyn-fig"></div><div class="dyn-gr"></div></div>'+
   '<div class="dyn-info"></div><div class="dyn-note"></div>'+
   '<input type="range" min="0" max="'+xmax+'" step="0.05" value="0" aria-label="時間 x（秒）">'+
   '<div class="dyn-btns"><button class="btn sub dplay">▶ 自動で動かす</button> <button class="btn sub dreset">0秒にもどす</button></div>'+
   '<div class="dyn-times"><span>各頂点に着く時刻（おすと、そこへ動きます）：</span></div>';
  var fig=root.querySelector('.dyn-fig'),gr=root.querySelector('.dyn-gr'),info=root.querySelector('.dyn-info'),note=root.querySelector('.dyn-note'),rg=root.querySelector('input'),tm=root.querySelector('.dyn-times');
  cfg.path.forEach(function(n,k){
    var b=document.createElement('button'); b.className='btn sub'; b.textContent=n+'（'+(k===0?'出発':nf(times[k])+'秒後')+'）';
    b.onclick=function(){ rg.value=times[k]; upd(times[k]); }; tm.appendChild(b);
  });
  var sc=Math.min(240/cfg.W,180/cfg.H),ox=88,oy=36;
  var PX=function(x){return ox+x*sc;},PY=function(y){return oy+(cfg.H-y)*sc;};
  function drawFig(x){
    var P=pos(x).p,q=shape(segOf(x),P),s='<svg class="graph" viewBox="0 0 410 275" xmlns="http://www.w3.org/2000/svg">';
    s+='<polygon points="'+['A','B','C','D'].map(function(n){return PX(V[n][0])+','+PY(V[n][1]);}).join(' ')+'" fill="#fff" stroke="#333" stroke-width="2.6"/>';
    s+='<polygon points="'+q.map(function(p){return PX(p[0])+','+PY(p[1]);}).join(' ')+'" fill="#e07a1f" fill-opacity="0.30" stroke="#e07a1f" stroke-width="2"/>';
    if(cfg.cut){ s+='<line x1="'+PX(P[0])+'" y1="'+PY(P[1])+'" x2="'+PX(V.D[0])+'" y2="'+PY(V.D[1])+'" stroke="#d4561f" stroke-width="2" stroke-dasharray="5 4"/>'; }
    var pl={A:[PX(0)-6,PY(cfg.H)-6,'end'],B:[PX(0)-6,PY(0)+17,'end'],C:[PX(cfg.W)+6,PY(0)+17,'start'],D:[PX(cfg.W)+6,PY(cfg.H)-6,'start']};
    cfg.path.forEach(function(n,k){
      var a=pl[n]; s+='<text x="'+a[0]+'" y="'+a[1]+'" font-size="13" font-weight="bold" fill="#14503f" text-anchor="'+a[2]+'">'+n+'<tspan font-size="11" fill="#a8480a">（'+(k===0?'出発':nf(times[k])+'秒後')+'）</tspan></text>';
    });

    for(k=0;k<nseg;k++){
      var s0=SEG[k][0],s1=SEG[k][1];

      else if(jumps[k]) pts.push([s1[0],s1[1],'','#999999','open']);

    }
    var g={tg:true,xmax:cfg.gx,ymax:cfg.ymax,xs:cfg.xs,ys:cfg.ys,xl:'時間 x（秒）',yl:'面積 y（cm²）',segs:segs,pts:pts,ic:[[x,y,'']],guides:[[x,y]],txt:[]};

    return graph(g);
  }
  function upd(x){
    var p=pos(x),sg=segOf(x),y=area(x),sec=cfg.secs[sg];

    note.innerHTML='<b>'+'①②③④'.charAt(sg)+'　'+nf(times[sg])+' ≦ x '+rel+' '+nf(times[sg+1])+'</b>　'+fmt(sec.note)+'<br>式：<b>'+fmt(sec.formula)+'</b>';
  }

  var timer=null,pl2=root.querySelector('.dplay');
  function stop(){ if(timer){ clearInterval(timer); timer=null; pl2.textContent='▶ 自動で動かす'; } }
  pl2.onclick=function(){

}

function dynG2(SEG,gx,ymax,xs,ys,hi,mode){
  var g={tg:true,xmax:gx,ymax:ymax,xs:xs,ys:ys,xl:'時間 x（秒）',yl:'面積 y（cm²）',segs:[],pts:[],txt:[]};
  var all=(mode==='all');
  SEG.forEach(function(s,k){ g.segs.push({p:s,c:all?'#d4561f':'#c9c9c9',dash:!all,w:all?3.4:2}); });
  if(hi!==undefined&&hi!==null){ var s=SEG[hi]; g.segs.push({p:s,c:'#d4561f',w:4}); g.txt.push({x:(s[0][0]+s[1][0])/2-0.15,y:(s[0][1]+s[1][1])/2+ymax*0.07,t:'①②③④'.charAt(hi),c:'#d4561f',s:16}); }
  if(all){
    SEG.forEach(function(s,k){
      var jump=(k<SEG.length-1)&&Math.abs(s[1][1]-SEG[k+1][0][1])>1e-6;
      g.pts.push([s[0][0],s[0][1],'('+nf(s[0][0])+', '+nf(s[0][1])+')','#d4561f']);
      if(jump) g.pts.push([s[1][0],s[1][1],'('+nf(s[1][0])+', '+nf(s[1][1])+')','#d4561f','open']);
      else if(k===SEG.length-1) g.pts.push([s[1][0],s[1][1],'('+nf(s[1][0])+', '+nf(s[1][1])+')','#d4561f']);
    });
  }
  return g;
}

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function buildExample(ex,idx){
  var box=document.createElement('div'); box.className='ex';
  var q=document.createElement('div'); q.className='q';
  q.innerHTML='<span class="tag">例題'+(idx+1)+'</span>'+fmt(ex.q);
  if(ex.g){ var qg=document.createElement('div'); qg.innerHTML=graph(ex.g); q.appendChild(qg); }
  box.appendChild(q);
  if(ex.widget) box.appendChild(ex.widget());
  var note=document.createElement('div'); note.className='cap'; note.style.textAlign='left';
  note.textContent='まず自分で考えてみましょう。ボタンを押すと、ヒントと解き方が1ステップずつ出てきます。';
  box.appendChild(note);
  var area=document.createElement('div'); box.appendChild(area);
  var btn=document.createElement('button'); btn.className='btn'; btn.textContent='STEP 1 を見る ▶';
  var prog=document.createElement('span'); prog.className='prog';
  var shown=0, n=ex.steps.length;
  btn.onclick=function(){
    if(shown>=n){ area.innerHTML=''; shown=0; btn.textContent='STEP 1 を見る ▶'; btn.className='btn'; prog.textContent=''; note.style.display=''; return; }
    var st=ex.steps[shown]; shown++;
    var d=document.createElement('div'); d.className='step';
    var label=(shown===n&&n>1)?'答え':'STEP '+shown;
    d.innerHTML='<span class="badge">'+label+'</span>'+fmt(st.t)+(st.g?graph(st.g):'');
    // 新しい図が出たら、前の図は消す
    if(st.g){ var olds=area.querySelectorAll('svg.graph'); for(var k=0;k<olds.length;k++){ olds[k].remove(); } }
    area.appendChild(d);
    note.style.display='none';
    prog.textContent=shown+' / '+n;
    if(shown>=n){ btn.textContent='最初からやり直す ↺'; btn.className='btn sub'; }
    else btn.textContent='STEP '+(shown+1)+' を見る ▶';
  };
  box.appendChild(btn); box.appendChild(prog);
  return box;
}

function buildQuiz(list,onPass){
  var wrap=document.createElement('div');
  var answered=0, right=0;
  var score=document.createElement('div'); score.className='score';
  list.forEach(function(item,i){
    var qd=document.createElement('div'); qd.className='quiz';
    var qn=document.createElement('div'); qn.className='qn';
    qn.innerHTML='問'+(i+1)+'．'+fmt(item.q);
    var figBox=document.createElement('div'); figBox.innerHTML=(item.g?graph(item.g):''); qn.appendChild(figBox);
    qd.appendChild(qn);
    var hintShown=false;
    if(item.g&&item.eg){
      var hb=document.createElement('button'); hb.className='btn sub'; hb.textContent='ヒント：図にヒントを出す ▶';
      hb.onclick=function(){ figBox.innerHTML=graph(item.eg); hb.disabled=true; hb.textContent='ヒントを図に表示しました'; hintShown=true; };
      qd.appendChild(hb);
    }
    var opts=item.o.map(function(t,k){return {t:t,ok:k===item.a};});
    shuffle(opts);
    var og=document.createElement('div'); og.className='opts';
    var fb=document.createElement('div'); fb.className='fb';
    var marks=['ア','イ','ウ','エ'];
    var btns=[];
    opts.forEach(function(op,k){
      var b=document.createElement('button');
      if(typeof op.t==='object'){ b.className='gr'; b.innerHTML=graph(op.t.g)+'<b>'+marks[k]+'</b>'; }
      else b.innerHTML='<b>'+marks[k]+'</b>　'+fmt(op.t);
      b.onclick=function(){
        btns.forEach(function(x,m){ x.disabled=true; if(opts[m].ok) x.classList.add('ok'); });
        if(!op.ok) b.classList.add('ng');
        fb.innerHTML=(op.ok?'<b style="color:var(--ok)">正解です！</b><br>':'<b style="color:var(--ng)">おしい！ もう一度、解説を読んでみましょう。</b><br>')+fmt(item.e)+(item.eg&&!hintShown?graph(item.eg):'');
        fb.classList.add('show');
        answered++; if(op.ok) right++;
        if(answered===list.length){
          score.style.display='block';
          score.textContent=list.length+'問中 '+right+'問 正解です。'+(right===list.length?(onPass?'✅ 合格！ すばらしい！ 次の単元に進みましょう。':'🎉 すばらしい！ 全問正解です。'):'まちがえた問題は、例題のステップをもう一度見直してみましょう。');
          if(right===list.length){ if(onPass) onPass(); else launchConfetti(); }
        }
      };
      btns.push(b); og.appendChild(b);
    });
    qd.appendChild(og); qd.appendChild(fb);
    wrap.appendChild(qd);
  });
  wrap.appendChild(score);
  return wrap;
}

U.forEach(function(u,i){ if(XQ[i]) u.ex.forEach(function(e,k){ if(XQ[i][k]){ e.pr=XQ[i][k].p; e.ck=XQ[i][k].c; } }); });


function go(i){ cur=i; render(); window.scrollTo(0,0); }
function renderIndex(){
  main.innerHTML='';
  var nt=document.createElement('div'); nt.className='notice';
  nt.innerHTML='見たい単元をえらんで、押してください。はじめての人は、<b>1番から順番に</b>進みましょう。各単元は「ポイント → 解説 → 例題（ステップ）→ 実践演習 → 総合確認」の順です。';
  main.appendChild(nt);
  GROUPS.forEach(function(g){
    if(g.big){ var bg=document.createElement('div'); bg.className='g-big'; bg.textContent=g.big; main.appendChild(bg); }
    var t=document.createElement('div'); t.className='g-sec'; t.innerHTML=g.t+'<span class="u-sub" style="margin-left:2px">'+g.s+'</span>'; main.appendChild(t);
    var list=document.createElement('div'); list.className='u-list';
    g.u.forEach(function(i){
      var b=document.createElement('button'); b.className='u-card';
      b.innerHTML='<span class="u-no">'+(i+1)+'</span><span class="u-name">'+fmt(U[i].title.replace(/^\d+\s+/,''))+'<span class="u-sub">'+fmt(SUBS[i]||'')+'</span></span>'+(isPass(U[i].title)?'<span class="u-badge">✅ 合格</span>':'')+'<span class="u-go">▶</span>';
      if(isPass(U[i].title)) b.className+=' pass';
      b.onclick=function(){go(i);};
      list.appendChild(b);
    });
    main.appendChild(list);
  });
}
function render(){
  nav.innerHTML='';
  if(cur<0){ renderIndex(); return; }
  var u=U[cur];
  main.innerHTML='';
  var tb=document.createElement('button'); tb.className='btn sub top-btn'; tb.textContent='◀ 単元一覧にもどる'; tb.onclick=function(){go(-1);}; main.appendChild(tb);
  var h=document.createElement('h2'); h.className='unit'; h.textContent=(cur+1)+' '+u.title.replace(/^\d+\s+/,''); main.appendChild(h);

  var pt=document.createElement('div'); pt.className='point';
  pt.innerHTML='<b class="t">ポイント</b>'+u.point.map(function(p){return '<div>'+fmt(p)+'</div>';}).join('');
  main.appendChild(pt);

  var s1=document.createElement('h3'); s1.className='sec'; s1.textContent='解説（まずはここを読みましょう）'; main.appendChild(s1);
  var ex=document.createElement('div'); ex.className='card';
  u.explain.forEach(function(p){
    if(typeof p==='string'){ var d=document.createElement('p'); d.style.margin='8px 0'; d.innerHTML=fmt(p); ex.appendChild(d); }
    else { var g=document.createElement('div'); g.innerHTML=graph(p.g)+(p.cap?'<div class="cap">'+fmt(p.cap)+'</div>':''); ex.appendChild(g); }
  });
  main.appendChild(ex);

  var s2=document.createElement('h3'); s2.className='sec'; s2.textContent='例題（ステップを見ながら、解き方を身につけましょう）'; main.appendChild(s2);
  u.ex.forEach(function(e,i){
    main.appendChild(buildExample(e,i));
    if(e.pr&&e.ck){
      var hp=document.createElement('h4'); hp.className='subq'; hp.textContent='✏️ 例題'+(i+1)+'の練習問題（2問）　答えを選んでください'; main.appendChild(hp);
      main.appendChild(buildQuiz(e.pr));
      var hc=document.createElement('h4'); hc.className='subq'; hc.textContent='📝 例題'+(i+1)+'の確認問題（2問）　全問正解で花吹雪'; main.appendChild(hc);
      main.appendChild(buildQuiz(e.ck));
    }
  });

  var s3=document.createElement('h3'); s3.className='sec'; s3.textContent='実践演習（5問）　答えを選んでください'; main.appendChild(s3);
  main.appendChild(buildQuiz(u.prac));

  var s4=document.createElement('h3'); s4.className='sec'; s4.textContent='総合確認（3問）'; main.appendChild(s4);
  main.appendChild(buildQuiz(u.check,function(){ markPass(u.title); launchConfetti(); }));

  var pg=document.createElement('div'); pg.className='pager';
  var pb=document.createElement('button'); pb.className='btn sub'; pb.textContent='◀ 前の単元';
  var nb=document.createElement('button'); nb.className='btn'; nb.textContent='次の単元 ▶';
  pb.onclick=function(){go(cur-1);}; nb.onclick=function(){go(cur+1);};
  var ib=document.createElement('button'); ib.className='btn sub'; ib.textContent='単元一覧'; ib.onclick=function(){go(-1);};
  if(cur>0) pg.appendChild(pb); else pg.appendChild(document.createElement('span'));
  pg.appendChild(ib);
  if(cur<U.length-1) pg.appendChild(nb); else pg.appendChild(document.createElement('span'));
  main.appendChild(pg);
}
render();
</script>
