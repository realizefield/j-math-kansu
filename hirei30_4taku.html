<style>
:root{--primary:#1a5276;--blue:#1565c0;--orange:#e67e22;--ok:#16a34a;--ok-bg:#dcfce7;--ng:#dc2626;--ng-bg:#fee2e2;--bg:#f8f9fa;--card:#fff;--text:#1e293b;--sub:#64748b;}

.card{background:var(--card);border:2px solid #90caf9;border-radius:12px;padding:16px 18px;margin-bottom:18px;}
.card.done-ok{border-color:var(--ok);}

.bubble .close{margin-top:10px;font-size:.8em;color:#a16207;font-weight:400;text-align:right;}
.final{text-align:center;margin:18px 0;}
.nav a.old{background:#fff;color:#64748b;border:1.5px solid #cbd5e1;}
.point{background:#fffbeb;border:2px solid #fcd34d;border-left:5px solid #f59e0b;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:.95em;}
.point b{color:#b45309;}
table.tbl{border-collapse:collapse;margin:0 0 12px;font-size:1.05em;}

.gwrap{text-align:center;margin:0 0 12px;}
.gwrap svg{max-width:260px;width:100%;height:auto;background:#fff;border:1.5px solid #90caf9;border-radius:8px;}
@media (max-width:560px){.choices{grid-template-columns:1fr;}}

<div class="wrap">
  <div class="title"><h1>㉚ 一次関数 確認テスト</h1><small>総合確認（各講から抜粋）（答えを4つの中から選ぼう・STEPとヒントつき）</small></div>

  <div class="score"><span id="scoreText">一発正解　0 / 0 問</span><button type="button" id="resetAll">最初からやり直す</button></div>

  <div class="howto">

<script>
/* ===== 問題データ（他の講に使うときは、この配列だけ差し替えます） =====

var PROBLEMS = [
 {
  "tag": "問1",
  "q": "次の式のうち、y が x の一次関数であるものはどれか。",
  "hint": "y = ax + b の形（a は 0 でない）なら一次関数。x² や 分母に x があるもの、x がないものは×。",
  "correct": "y = 3x + 2",
  "wrongs": [
   "y = x²",
   "y = 4",
   "y = 6 ÷ x"
  ],
  "pos": 2,
  "steps": [
   {
    "how": "一次関数は y = ax + b（a は 0 でない数）の形で表せる式。",
    "calc": "y = ax + b（a ≠ 0）"
   },
   {
    "how": "x の2乗や、x が分母にある式、x がない式（y = 数）は一次関数ではない。",
    "calc": "x²・定数・6 ÷ x は、y = ax + b の形にならない"
   },
   {
    "how": "選択肢を1つずつ、y = ax + b の形かどうか確かめる。",
    "calc": "一次関数は　y = 3x + 2"
   }
  ],
  "ans": "y = 3x + 2"
 },
 {
  "tag": "問2",
  "q": "一次関数 y = −2x + 7 の傾きと切片を答えよ。",
  "hint": "y = ax + b の「x の前の数」が傾き、「あとに足す数」が切片です。符号も読みます。",
  "correct": "傾き −2、切片 7",
  "wrongs": [
   "傾き 7、切片 −2",

  "pos": 1,
  "steps": [
   {
    "how": "式を y = ax + b の形に見る。a が傾き、b が切片。",

   },
   {
    "how": "x の前にある数が傾き。符号（＋・−）もいっしょに読む。",
    "calc": "傾き ＝ −2"
   },
   {
    "how": "x のあとに足している（引いている）数が切片。引いているときは − をつける。",
    "calc": "切片 ＝ 7"
   }
  ],
  "ans": "傾き −2、切片 7"
 },
 {
  "tag": "問3",
  "q": "一次関数 y = 3x − 1 において、x が 2 から 5 まで増加するときの変化の割合を求めよ。",
  "hint": "一次関数の変化の割合は、いつも傾き a と同じです。",
  "correct": "3",
  "wrongs": [
   "9",
   "14",
   "5"
  ],
  "pos": 0,
  "steps": [
   {

  "ans": "3"

 {

  "correct": "y = −2x + 6",
  "wrongs": [
   "y = −2x − 6",

  "pos": 3,
  "steps": [
   {
    "how": "表から傾き a を求める（x が増えた量と y が増えた量を見る）。",

    "how": "求めた a と b を y = ax + b にもどして、式を完成させる。",

    2,

  "wrongs": [
   "切片 −1、傾き 3、右下がり",

  "steps": [

    "how": "x の前の数 a が傾き。",

  "wrongs": [
   "y = 2x + 1",
   "y = −x + 2",

  ],
  "pos": 3,
  "steps": [
   {
    "how": "グラフが y 軸と交わる点を読み取る。これが切片 b。",

   },
   {
    "how": "切片の点から、右へ進んで格子点までの「右へ」と「上（下）へ」の数を数え、傾き a を求める。",

    "how": "a と b を y = ax + b に入れて、式を完成させる。",

   }
  ],
  "ans": "y = x + 2",
  "graph": {
   "a": [
    1,
    1

    [

    ],
    [

    ]
   ]
  }
 },
 {
  "tag": "問7",

  "hint": "y = ax + b の a が傾き、b が切片です。",
  "correct": "y = 3x − 2",
  "wrongs": [
   "y = −2x + 3",
   "y = 3x + 2",
   "y = −3x − 2"
  ],
  "pos": 1,
  "steps": [
   {
    "how": "直線の式は y = ax + b。",

   },
   {
    "how": "傾きを a、切片を b に入れる。",

   },

    "calc": "y = 3x − 2"
   }
  ],
  "ans": "y = 3x − 2"
 },
 {
  "tag": "問8",
  "q": "傾きが 2 で、点 (1, 5) を通る一次関数の式を求めよ。",
  "hint": "y = ax + b に傾きと点の x, y を代入すると、b が出ます。",

  "wrongs": [

  "steps": [

  "ans": "y = 2x + 3"

 },
 {

  "q": "3 点 A(0, 4)、B(−2, 0)、C(3, 0) を頂点とする三角形の面積を求めよ。",
  "hint": "底辺 ＝ x 軸上の 2 点の間、高さ ＝ A の y 座標。面積 ＝ 底辺 × 高さ ÷ 2。",

var CIRCLED = ['①','②','③','④'];
function fmt(s){
  s = String(s).replace(/[xyab]/g, function(c){ return '<i>'+c+'</i>'; }).replace(/\n/g, '<br>');
  return s.replace(/\{(\d+)\/(\d+)\}/g, function(_, n, d){
    return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';
  });
}
function tableHtml(tb){
  function cells(arr){ return arr.map(function(v){ return '<td>'+String(v).replace('-','−')+'</td>'; }).join(''); }
  return '<table class="tbl"><tr><th>'+fmt('x')+'</th>'+cells(tb.x)+'</tr><tr><th>'+fmt('y')+'</th>'+cells(tb.y)+'</tr></table>';
}
function graphSvg(g){
  var O=130, U=24, N=5, a=g.a[0]/g.a[1], b=g.b[0]/g.b[1], s='';
  function X(x){ return O+x*U; } function Y(y){ return O-y*U; }
  for (var i=-N;i<=N;i++){
    s += '<line x1="'+X(i)+'" y1="'+Y(-N)+'" x2="'+X(i)+'" y2="'+Y(N)+'" stroke="#dbeafe" stroke-width="1"/>';
    s += '<line x1="'+X(-N)+'" y1="'+Y(i)+'" x2="'+X(N)+'" y2="'+Y(i)+'" stroke="#dbeafe" stroke-width="1"/>';
  }
  s += '<line x1="'+X(-N-0.4)+'" y1="'+Y(0)+'" x2="'+X(N+0.4)+'" y2="'+Y(0)+'" stroke="#334155" stroke-width="1.6"/>';
  s += '<line x1="'+X(0)+'" y1="'+Y(-N-0.4)+'" x2="'+X(0)+'" y2="'+Y(N+0.4)+'" stroke="#334155" stroke-width="1.6"/>';
  s += '<text x="'+(X(N)+10)+'" y="'+(Y(0)+16)+'" font-size="13" font-style="italic" fill="#334155">x</text>';
  s += '<text x="'+(X(0)+8)+'" y="'+(Y(N)-4)+'" font-size="13" font-style="italic" fill="#334155">y</text>';
  s += '<text x="'+(X(0)-12)+'" y="'+(Y(0)+13)+'" font-size="10" fill="#64748b">O</text>';
  for (var k=-4;k<=4;k++){ if(!k) continue;
    var lab = String(k).replace('-','−');
    s += '<text x="'+X(k)+'" y="'+(Y(0)+13)+'" font-size="9" text-anchor="middle" fill="#64748b">'+lab+'</text>';
    s += '<text x="'+(X(0)-5)+'" y="'+(Y(k)+3)+'" font-size="9" text-anchor="end" fill="#64748b">'+lab+'</text>';
  }
  var pts=[]; for (var x=-N; x<=N+1e-9; x+=0.05){ var y=a*x+b; if (y>=-N-1e-9 && y<=N+1e-9) pts.push(X(x).toFixed(1)+','+Y(y).toFixed(1)); }
  s += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#e11d48" stroke-width="2.4"/>';
  (g.pts||[]).forEach(function(p){ s += '<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4.5" fill="#1565c0" stroke="#fff" stroke-width="1.5"/>'; });
  return '<div class="gwrap"><svg viewBox="0 0 260 260" role="img" aria-label="一次関数のグラフ">'+s+'</svg></div>';
}
var state = [];
var scoreBox = document.getElementById('scoreText');

function layout(p, shift){
  var arr = p.wrongs.slice();
  var pos = (p.pos + shift) % 4;
  arr.splice(pos, 0, p.correct);
  return arr;
}
function newState(){ return {shown:0, chosen:null, mode:'play', first:null, shift:0}; }

function render(){
  var list = document.getElementById('list');
  list.innerHTML = '';
  PROBLEMS.forEach(function(p, i){
    var st = state[i];
    var card = document.createElement('div');
    card.className = 'card' + (st.mode==='ok' ? ' done-ok' : '') + (st.mode==='ng' ? ' done-ng' : '');
    var showAll = (st.mode==='ng') || (st.mode==='exp');
    var h = '<span class="tag">'+p.tag+'</span><div class="q">'+fmt(p.q)+'</div>'
          + (p.table ? tableHtml(p.table) : '') + (p.graph ? graphSvg(p.graph) : '');

    var locked = (st.mode!=='play');
    h += '<div class="tools">';
    h += '<button type="button" class="btn step" data-act="step" data-i="'+i+'"'
       + ((locked || st.shown>=p.steps.length) ? ' disabled' : '') + '>'
       + (locked ? '👣 STEP' : (st.shown>=p.steps.length ? '👣 全STEP表示ずみ' : '👣 STEP '+(st.shown+1)+' を見る')) + '</button>';
    h += '<button type="button" class="btn hint" data-act="hint" data-i="'+i+'"'+(locked?' disabled':'')+'>💡 ヒント</button>';
    h += '</div>';

    var order = layout(p, st.shift);
    h += '<div class="choices">';
    order.forEach(function(c, k){
      var cls = 'choice';
      if (st.mode!=='play'){
        if (c===p.correct) cls += ' ok';
        else if (st.chosen===k) cls += ' ng';
      } else if (st.chosen===k) { cls += ' ng'; }
      h += '<button type="button" class="'+cls+'" data-act="pick" data-i="'+i+'" data-k="'+k+'"'+(locked?' disabled':'')+'>'
         + '<span class="no">'+CIRCLED[k]+'</span><span class="math">'+fmt(c)+'</span></button>';
    });
    h += '</div>';

    if (st.mode==='ok'){
      h += '<div class="result ok">⭕ 正解です！' + (st.first ? '（一発正解 🎉）' : '') + '</div>';
      h += '<div class="tools"><button type="button" class="btn exp" data-act="exp" data-i="'+i+'">📖 解説を見る</button></div>';
    }
    if (st.mode==='ng'){
      h += '<div class="result ng">❌ おしい！ 全部の解説と答えを出しました。解き方を確認しましょう。</div>';
    }

    var n = showAll ? p.steps.length : st.shown;
    if (n>0){
      h += '<div class="steps'+(showAll?' show-all':'')+'">';
      for (var s=0; s<n; s++){
        h += '<div class="stepbox"><span class="lab">STEP '+(s+1)+'</span>'+fmt(p.steps[s].how)
           + '<div class="calc">→ <span class="math">'+fmt(p.steps[s].calc)+'</span></div></div>';
      }
      h += '</div>';
    }
    if (showAll){
      h += '<div class="ansbox">答え　'+CIRCLED[order.indexOf(p.correct)]+'　<span class="math">'+fmt(p.ans)+'</span></div>';
      h += '<div class="tools" style="margin-top:10px"><button type="button" class="btn retry" data-act="retry" data-i="'+i+'">🔁 もう一度ちょうせん</button></div>';
    }
    card.innerHTML = h;
    list.appendChild(card);
  });
  updateScore();
}

function updateScore(){
  var done = 0, firstOk = 0;
  state.forEach(function(st){
    if (st.mode!=='play'){ done++; }
    if (st.first===true) firstOk++;
  });
  scoreBox.textContent = '一発正解　'+firstOk+' / '+PROBLEMS.length+' 問';
  var fm = document.getElementById('finalMsg');
  var allDone = state.every(function(st){ return st.mode==='ok' || st.mode==='exp'; });
  fm.textContent = allDone ? ('🎉 全問おわり！ 一発正解は '+firstOk+' / '+PROBLEMS.length+' 問でした。') : '';
}

function openHint(i){
  document.getElementById('hintText').innerHTML = fmt(PROBLEMS[i].hint);
  document.getElementById('hintOverlay').classList.add('on');
}
/* ヒントは画面のどこをタップしても閉じる（中をタップしても閉じる） */
document.getElementById('hintOverlay').addEventListener('click', function(){
  this.classList.remove('on');
});

document.getElementById('list').addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  var i = +b.getAttribute('data-i'), st = state[i], p = PROBLEMS[i], act = b.getAttribute('data-act');
  if (act==='step'){
    if (st.shown < p.steps.length) st.shown++;
  } else if (act==='hint'){
    openHint(i); return;
  } else if (act==='pick'){
    var k = +b.getAttribute('data-k');
    var order = layout(p, st.shift);
    st.chosen = k;
    var ok = (order[k]===p.correct);
    if (st.first===null) st.first = ok;
    st.mode = ok ? 'ok' : 'ng';
  } else if (act==='exp'){
    st.mode = 'exp';
  } else if (act==='retry'){
    st.mode = 'play'; st.chosen = null; st.shown = 0; st.shift = (st.shift+1) % 4;
  }
  render();
});

document.getElementById('resetAll').addEventListener('click', function(){
  state = PROBLEMS.map(newState); render(); window.scrollTo(0,0);
});

state = PROBLEMS.map(newState);
render();
</script>
