<html lang="ja">
<head>
<meta charset="UTF-8">

<title>二次関数　y＝ax²・変域・交点・応用 | 江原予備校 GAMBA</title>
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#2b2b2b; --sub:#666; --main:#1f6f5c; --main-d:#14503f;
  --accent:#e07a1f; --point:#fff6e0; --line:#d9d4c5; --ok:#1f8a4c; --ng:#c0392b; --soft:#e8f3ef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;line-height:1.9;font-size:17px}
header{background:var(--main);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:1.35rem}
header p{margin:4px 0 0;font-size:.9rem;opacity:.9}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 4px;max-width:900px;margin:0 auto}
nav button{border:1px solid var(--main);background:#fff;color:var(--main);border-radius:20px;padding:6px 12px;font-size:.88rem;cursor:pointer}
nav button.on{background:var(--main);color:#fff}
main{max-width:900px;margin:0 auto;padding:8px 12px 60px}
h2.unit{font-size:1.4rem;border-left:8px solid var(--main);padding-left:10px;margin:18px 0 6px}
h3.sec{background:var(--soft);color:var(--main-d);padding:6px 12px;border-radius:6px;font-size:1.1rem;margin:30px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.point{background:var(--point);border:2px solid var(--accent);border-radius:10px;padding:12px 16px;margin:10px 0}
.point b.t{display:inline-block;background:var(--accent);color:#fff;padding:0 10px;border-radius:4px;margin-bottom:6px}
.point div{margin:4px 0}
.imp{border:2px solid var(--main);border-radius:8px;padding:6px 14px;margin:10px 0;background:#f4faf8}
table.t{border-collapse:collapse;margin:8px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid #bbb;padding:3px 12px;text-align:center}
table.t th{background:#efefe6}
.fr{display:inline-block;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px}
.fr>span{display:block;padding:0 2px}
.fr>span:first-child{border-bottom:1px solid currentColor}
svg.graph{width:100%;max-width:360px;display:block;margin:8px auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.cap{text-align:center;font-size:.85rem;color:var(--sub);margin-top:-4px}
.ex{background:#fff;border:2px solid var(--main);border-radius:10px;padding:12px 16px;margin:14px 0}
.ex .q{font-weight:bold}

.btn{background:var(--main);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:1rem;cursor:pointer;margin-top:6px}
.btn:hover{background:var(--main-d)}
.btn.sub{background:#fff;color:var(--main);border:1px solid var(--main)}
.prog{font-size:.85rem;color:var(--sub);margin-left:8px}
.quiz{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}
.quiz .qn{font-weight:bold}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opts button{border:2px solid #cfcab9;background:#fcfcf8;border-radius:8px;padding:8px 10px;font-size:1rem;cursor:pointer;text-align:left}
.opts button.gr{text-align:center}
.opts button svg.graph{max-width:190px;margin:2px auto 4px}
.opts button:hover:not(:disabled){border-color:var(--main)}
.opts button.ok{border-color:var(--ok);background:#e6f6ec}
.opts button.ng{border-color:var(--ng);background:#fdeaea}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;background:#f1f1ea;display:none}
.fb.show{display:block;animation:in .3s}
.score{font-weight:bold;font-size:1.1rem;color:var(--main-d);background:var(--soft);padding:10px 14px;border-radius:8px;margin:10px 0;display:none}
.pager{display:flex;justify-content:space-between;margin-top:30px}

.subq{margin:14px 0 4px;padding:4px 12px;border-left:6px solid var(--accent);background:#fff8e8;font-size:1rem;border-radius:0 8px 8px 0}
.g-big{margin:26px 0 4px;padding:8px 14px;background:#14503f;color:#fff;font-size:18px;font-weight:bold;border-radius:8px;letter-spacing:.1em}
.g-sec{font-size:1.05rem;font-weight:bold;color:var(--main-d);border-left:5px solid var(--main);padding-left:10px;margin:26px 0 10px}
.u-list{display:flex;flex-direction:column;gap:8px}
.u-card{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;font-size:1rem;color:var(--ink);width:100%}
.u-card:hover{border-color:var(--main);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.u-no{background:var(--main);color:#fff;font-weight:bold;border-radius:8px;min-width:2.3em;text-align:center;padding:2px 6px;flex-shrink:0}
.u-name{flex:1;font-weight:bold;line-height:1.45}
.u-sub{display:block;font-size:.82rem;font-weight:normal;color:var(--sub);margin-top:2px}
.u-go{color:#b9b5a6;font-size:1.1rem}
.top-btn{margin:12px 0 0}
.notice{background:var(--soft);border:1.5px solid var(--main);border-radius:10px;padding:10px 14px;margin:14px 0;font-size:.95rem;line-height:1.8}
.confetti-piece{position:fixed;top:-20px;opacity:0;animation:confettiFall linear forwards;pointer-events:none;z-index:9999}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}80%{opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.u-badge{font-size:.75rem;font-weight:bold;padding:2px 9px;border-radius:10px;white-space:nowrap;background:#dcfce7;color:#15803d;border:1px solid #86efac;flex-shrink:0}
.u-card.pass{background:#f0fdf4;border-color:#86efac}
.dyn{border:2px dashed var(--accent);border-radius:10px;padding:8px 10px;margin:10px 0;background:#fffdf6}
.dyn-title{font-weight:bold;color:var(--accent);margin-bottom:4px}
.dyn-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dyn-fig,.dyn-gr{flex:1 1 300px;min-width:0}
.dyn input[type=range]{width:100%;margin:6px 0}
.dyn-info{font-size:1.05rem}
.dyn-note{background:#fff;border-left:5px solid var(--accent);padding:4px 10px;margin:6px 0;border-radius:0 8px 8px 0}
.dyn-btns{margin:4px 0}
.dyn-times{margin-top:6px}.dyn-times span{font-size:.9rem;color:var(--sub);margin-right:4px}
.dyn-times .btn{padding:4px 10px;font-size:.9rem;margin:2px}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:20px}

</style>

<header>
  <h1>二次関数　y＝ax²</h1>

<script>
/* ---------- 表示用ユーティリティ ---------- */
function fmt(s){ return s.replace(/\{([^{}\/]+)\/([^{}\/]+)\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>'); }
function N(v){ return String(v).replace('-','−'); }
function T(xs,ys){
  return '<table class="t"><tr><th>x</th>'+xs.map(function(v){return '<td>'+N(v)+'</td>';}).join('')+'</tr><tr><th>y</th>'+ys.map(function(v){return '<td>'+N(v)+'</td>';}).join('')+'</tr></table>';
}
function P(xs,ys){ return xs.map(function(x,i){return [x,ys[i]];}); }
/* 放物線 y＝a x² 上の点のリスト（ラベルつき） */
function PP(a,xs,lab){ return xs.map(function(x){ var y=a*x*x; return [x,Math.round(y*1000)/1000,lab?('('+String(x).replace('-','−')+', '+String(Math.round(y*1000)/1000).replace('-','−')+')'):null]; }); }

/* ---------- 二次関数用グラフ描画（放物線・直線・点・多角形・帯・ガイド線） ----------
 graph(o)  o の主な項目（すべて省略可）
  xmin,xmax,ymin,ymax : 表示範囲（既定 −5〜5）   xs,ys : 目もり・方眼の間隔（既定 1）   H : 高さ（既定 340）
  mini:true            : 目もりの数字を出さない（選択肢の小さい図用）
  curves:[{a,c,l,lp,x1,x2,dash,w}]   y＝a x² の放物線。l=ラベル、lp=[x,y]ラベル位置、x1,x2=かく範囲
  lines:[{a,b,c,l,lp,x1,x2,dash,w}]  y＝a x＋b の直線
  vlines:[{x,c,dash,l}] hlines:[{y,c,dash,l}]   x＝k、y＝k の線
  bands:[{x1,x2,c,op}]  hbands:[{y1,y2,c,op}]   縦・横の帯（変域を色で示す）
  polys:[{p:[[x,y],...],c,op,l,lp}]  塗りつぶし多角形（三角形・長方形）
  segs:[{f,t,c,dash,w,l,lo}]         線分。l=ラベル、lo=[dx,dy] ラベルのずらし（ピクセル）
  arr:[{f,t,c,l,lo}]                  矢印
  pts:[[x,y,'ラベル','色','open','位置']]  点。位置 = ur,ul,dr,dl,u,d,l,r（既定 ur）
  ic:[[x,y,'ラベル','色','open','位置']]  強調する点（大きいオレンジ）
  guides:[[x,y,mode,xlabel,ylabel]]  点から軸へ点線をおろし、軸に数を出す。mode='x' なら x軸だけ、'y' なら y軸だけ
  txt:[{x,y,t,c,s,a}]                 文字。a='start'|'middle'|'end'
*/
function graph(o){
  o=o||{};
  var xmin=o.xmin!=null?o.xmin:-5, xmax=o.xmax!=null?o.xmax:5, ymin=o.ymin!=null?o.ymin:-5, ymax=o.ymax!=null?o.ymax:5;
  var xs=o.xs||1, ys=o.ys||1;
  var W=380, H=o.H||340, L=o.mini?14:38, Rm=16, Tm=16, Bm=o.mini?14:26, pw=W-L-Rm, ph=H-Tm-Bm;
  var X=function(x){return L+(x-xmin)/(xmax-xmin)*pw;}, Y=function(y){return Tm+(ymax-y)/(ymax-ymin)*ph;};
  var tk=function(v){ return String(Math.round(v*100)/100).replace('-','−'); };
  var uid='c'+Math.floor(Math.random()*1e9);
  var s='<svg class="graph" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="'+uid+'"><rect x="'+L+'" y="'+Tm+'" width="'+pw+'" height="'+ph+'"/></clipPath></defs>';
  var v, i;
  (o.bands||[]).forEach(function(b){ s+='<rect x="'+X(b.x1)+'" y="'+Tm+'" width="'+(X(b.x2)-X(b.x1))+'" height="'+ph+'" fill="'+(b.c||'#2a6fb0')+'" fill-opacity="'+(b.op||0.13)+'"/>'; });
  (o.hbands||[]).forEach(function(b){ s+='<rect x="'+L+'" y="'+Y(b.y2)+'" width="'+pw+'" height="'+(Y(b.y1)-Y(b.y2))+'" fill="'+(b.c||'#c0392b')+'" fill-opacity="'+(b.op||0.13)+'"/>'; });
  /* 方眼 */
  for(v=Math.ceil(xmin/xs-1e-9)*xs; v<=xmax+1e-9; v+=xs) s+='<line x1="'+X(v)+'" y1="'+Tm+'" x2="'+X(v)+'" y2="'+(Tm+ph)+'" stroke="#e4e4dc" stroke-width="1"/>';
  for(v=Math.ceil(ymin/ys-1e-9)*ys; v<=ymax+1e-9; v+=ys) s+='<line x1="'+L+'" y1="'+Y(v)+'" x2="'+(L+pw)+'" y2="'+Y(v)+'" stroke="#e4e4dc" stroke-width="1"/>';
  /* 軸 */
  var ax=X(Math.min(Math.max(0,xmin),xmax)), ay=Y(Math.min(Math.max(0,ymin),ymax));
  s+='<line x1="'+L+'" y1="'+ay+'" x2="'+(L+pw+8)+'" y2="'+ay+'" stroke="#333" stroke-width="1.6"/>';
  s+='<line x1="'+ax+'" y1="'+(Tm+ph)+'" x2="'+ax+'" y2="'+(Tm-8)+'" stroke="#333" stroke-width="1.6"/>';
  s+='<polygon points="'+(L+pw+10)+','+ay+' '+(L+pw+2)+','+(ay-3.5)+' '+(L+pw+2)+','+(ay+3.5)+'" fill="#333"/>';
  s+='<polygon points="'+ax+','+(Tm-10)+' '+(ax-3.5)+','+(Tm-2)+' '+(ax+3.5)+','+(Tm-2)+'" fill="#333"/>';
  s+='<text x="'+(L+pw)+'" y="'+(ay-6)+'" font-size="14" font-style="italic" text-anchor="end" fill="#333">x</text>';
  s+='<text x="'+(ax+7)+'" y="'+(Tm+9)+'" font-size="14" font-style="italic" fill="#333">y</text>';
  if(!o.mini){
    s+='<text x="'+(ax-5)+'" y="'+(ay+13)+'" font-size="12" text-anchor="end" fill="#333">O</text>';
    for(v=Math.ceil(xmin/xs-1e-9)*xs; v<=xmax+1e-9; v+=xs){ if(Math.abs(v)<1e-9) continue; s+='<text x="'+X(v)+'" y="'+(ay+13)+'" font-size="10.5" fill="#555" text-anchor="middle" stroke="#fff" stroke-width="2.5" paint-order="stroke">'+tk(v)+'</text>'; }
    for(v=Math.ceil(ymin/ys-1e-9)*ys; v<=ymax+1e-9; v+=ys){ if(Math.abs(v)<1e-9) continue; s+='<text x="'+(ax-4)+'" y="'+(Y(v)+3.5)+'" font-size="10.5" fill="#555" text-anchor="end" stroke="#fff" stroke-width="2.5" paint-order="stroke">'+tk(v)+'</text>'; }
  }
  /* 多角形 */
  (o.polys||[]).forEach(function(pg){
    var d=pg.p.map(function(p){return X(p[0])+','+Y(p[1]);}).join(' ');
    s+='<polygon clip-path="url(#'+uid+')" points="'+d+'" fill="'+(pg.c||'#e07a1f')+'" fill-opacity="'+(pg.op||0.2)+'" stroke="'+(pg.c||'#e07a1f')+'" stroke-width="'+(pg.w||2)+'"'+(pg.dash?' stroke-dasharray="5 3"':'')+' stroke-linejoin="round"/>';
    if(pg.l){
      var cx=0, cy=0; pg.p.forEach(function(p){cx+=p[0];cy+=p[1];}); cx/=pg.p.length; cy/=pg.p.length;
      var lp=pg.lp||[cx,cy];
      s+='<text x="'+X(lp[0])+'" y="'+(Y(lp[1])+4)+'" font-size="13" font-weight="bold" fill="'+(pg.c||'#a8480a')+'" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">'+pg.l+'</text>';
    }
  });
  /* 曲線・直線 */
  var lab=function(px,py,txt,col,anchor,fs){
    return '<text x="'+px+'" y="'+py+'" font-size="'+(fs||13)+'" font-weight="bold" fill="'+col+'" text-anchor="'+(anchor||'start')+'" stroke="#fff" stroke-width="3" paint-order="stroke">'+txt+'</text>';
  };
  (o.curves||[]).forEach(function(cv){
    var a=cv.a, x1=cv.x1!=null?cv.x1:xmin, x2=cv.x2!=null?cv.x2:xmax, n=320, d='', k, x, col=cv.c||'#d4561f';
    for(k=0;k<=n;k++){ x=x1+(x2-x1)*k/n; d+=(k?'L':'M')+X(x).toFixed(2)+','+Y(a*x*x).toFixed(2); }
    s+='<path clip-path="url(#'+uid+')" d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+(cv.w||2.6)+'"'+(cv.dash?' stroke-dasharray="6 4"':'')+' stroke-linejoin="round"/>';
    if(cv.l){
      var lx,ly;
      if(cv.lp){ lx=cv.lp[0]; ly=cv.lp[1]; }
      else {
        var yt=a>0? ymin+0.62*(ymax-ymin) : ymin+0.38*(ymax-ymin);
        lx=Math.sqrt(Math.max(yt/a,0)); if(!(lx<x2)) lx=x2*0.8; if(lx>xmax-0.1*(xmax-xmin)) lx=xmax-0.1*(xmax-xmin);
        ly=a*lx*lx;
      }
      var px=X(lx), py=Y(ly), right=px>W-90;
      s+=lab(right?px-6:px+8, py+(a>0?4:4), cv.l, col, right?'end':'start');
    }
  });
  (o.lines||[]).forEach(function(ln){
    var a=ln.a, b=ln.b||0, x1=ln.x1!=null?ln.x1:xmin, x2=ln.x2!=null?ln.x2:xmax, col=ln.c||'#2a6fb0';
    s+='<line clip-path="url(#'+uid+')" x1="'+X(x1)+'" y1="'+Y(a*x1+b)+'" x2="'+X(x2)+'" y2="'+Y(a*x2+b)+'" stroke="'+col+'" stroke-width="'+(ln.w||2.4)+'"'+(ln.dash?' stroke-dasharray="6 4"':'')+'/>';
    if(ln.l){
      var lx2,ly2;
      if(ln.lp){ lx2=ln.lp[0]; ly2=ln.lp[1]; }
      else { lx2=Math.min(x2,xmax)-0.03*(xmax-xmin); var kk=0; while(kk<400 && (a*lx2+b>ymax-0.07*(ymax-ymin) || a*lx2+b<ymin+0.07*(ymax-ymin)) && lx2>x1){ lx2-=(xmax-xmin)/200; kk++; } ly2=a*lx2+b; }
      var qx=X(lx2), qy=Y(ly2);
      s+=lab(qx-4, qy+(a>0?16:-8), ln.l, col, 'end');
    }
  });
  (o.vlines||[]).forEach(function(vl){
    s+='<line clip-path="url(#'+uid+')" x1="'+X(vl.x)+'" y1="'+Tm+'" x2="'+X(vl.x)+'" y2="'+(Tm+ph)+'" stroke="'+(vl.c||'#8e44ad')+'" stroke-width="2"'+(vl.dash===false?'':' stroke-dasharray="6 4"')+'/>';
    if(vl.l) s+=lab(X(vl.x)+5, Tm+14, vl.l, vl.c||'#8e44ad');
  });
  (o.hlines||[]).forEach(function(hl){
    s+='<line clip-path="url(#'+uid+')" x1="'+L+'" y1="'+Y(hl.y)+'" x2="'+(L+pw)+'" y2="'+Y(hl.y)+'" stroke="'+(hl.c||'#8e44ad')+'" stroke-width="2"'+(hl.dash===false?'':' stroke-dasharray="6 4"')+'/>';
    if(hl.l) s+=lab(L+pw-4, Y(hl.y)-5, hl.l, hl.c||'#8e44ad', 'end');
  });
  /* 線分・矢印 */
  (o.segs||[]).forEach(function(sg){
    var col=sg.c||'#c0392b';
    s+='<line x1="'+X(sg.f[0])+'" y1="'+Y(sg.f[1])+'" x2="'+X(sg.t[0])+'" y2="'+Y(sg.t[1])+'" stroke="'+col+'" stroke-width="'+(sg.w||2.8)+'"'+(sg.dash?' stroke-dasharray="5 4"':'')+' stroke-linecap="round"/>';
    if(sg.l){
      var lo=sg.lo||[8,-6];
      s+=lab((X(sg.f[0])+X(sg.t[0]))/2+lo[0], (Y(sg.f[1])+Y(sg.t[1]))/2+lo[1], sg.l, col, sg.la||'start', 12.5);
    }
  });
  (o.arr||[]).forEach(function(a){
    var col=a.c||'#2a6fb0', x1=X(a.f[0]), y1=Y(a.f[1]), x2=X(a.t[0]), y2=Y(a.t[1]);
    var dx=x2-x1, dy=y2-y1, Ln=Math.sqrt(dx*dx+dy*dy)||1, ux=dx/Ln, uy=dy/Ln, hs=9;
    s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+(x2-ux*hs*0.7)+'" y2="'+(y2-uy*hs*0.7)+'" stroke="'+col+'" stroke-width="3"/>';
    s+='<polygon points="'+x2+','+y2+' '+(x2-ux*hs+uy*hs*0.5)+','+(y2-uy*hs-ux*hs*0.5)+' '+(x2-ux*hs-uy*hs*0.5)+','+(y2-uy*hs+ux*hs*0.5)+'" fill="'+col+'"/>';
    if(a.l){ var lo2=a.lo||[8,-6]; s+=lab((x1+x2)/2+lo2[0], (y1+y2)/2+lo2[1], a.l, col, 'start', 12.5); }
  });
  /* ガイド線（軸におろす点線と、軸の上の数） */
  (o.guides||[]).forEach(function(g){
    var mode=g[2]||'xy';
    if(mode.indexOf('x')>=0){
      s+='<line x1="'+X(g[0])+'" y1="'+Y(g[1])+'" x2="'+X(g[0])+'" y2="'+ay+'" stroke="#e07a1f" stroke-width="1.5" stroke-dasharray="4 3"/>';
      if(!o.mini) s+='<text x="'+X(g[0])+'" y="'+(ay+(g[1]>=0?15:-6))+'" font-size="12.5" fill="#a8480a" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">'+(g[3]!=null?g[3]:tk(g[0]))+'</text>';
    }

  return s+String(Math.round(w*100)/100);
}

  var y1=a*x1*x1, y2=a*x2*x2, has0=(x1<=0&&x2>=0);

    if(has0) g.ic=[[0,0,(nm[2]?nm[2]+' ':'')+'(0, 0)','',  '',pl[2]]];
  }
  if(st>=2){
    g.hbands=[{y1:lo,y2:hi,c:RED,op:0.14}];

(function(){
var BLUE='#2a6fb0', RED='#c0392b';
function FV(v){
  var s=v<0?'−':'', w=Math.abs(v), d, n;
  for(d=1;d<=12;d++){ n=Math.round(w*d); if(Math.abs(w*d-n)<1e-9) return s+(d===1?String(n):n+'/'+d); }
  return s+String(Math.round(w*100)/100);
}
function RG(lo,hi){ return lo+' ≦ y ≦ '+hi; }
/* 変域の図。stage 0=x の変域だけ / 1=はしと頂点の点 / 2=y の変域の帯も */
function D(o){
  var a=o.a, x1=o.x1, x2=o.x2, st=o.st==null?2:o.st;
  var y1=a*x1*x1, y2=a*x2*x2, has0=(x1<=0&&x2>=0);
  var lo=Math.min(y1,y2,has0?0:1e9), hi=Math.max(y1,y2,has0?0:-1e9);
  var g=Object.assign({}, o.view);
  g.curves=[{a:a,c:'#e9bda9',w:2.2},{a:a,x1:x1,x2:x2,c:'#d4561f',w:4}];
  g.bands=[{x1:x1,x2:x2,c:BLUE,op:0.14}];
  var nm=o.names||[], pl=o.pos||['ul','ur','dr'];
  if(st>=1){
    g.pts=[[x1,y1,(nm[0]?nm[0]+' ':'')+'('+FV(x1)+', '+FV(y1)+')','#1f6f5c','',pl[0]],[x2,y2,(nm[1]?nm[1]+' ':'')+'('+FV(x2)+', '+FV(y2)+')','#1f6f5c','',pl[1]]];
    if(!has0&&o.vtx) g.pts.push([0,0,'頂点 (0, 0)','#8e44ad','open','dr']);
    if(has0) g.ic=[[0,0,(nm[2]?nm[2]+' ':'')+'(0, 0)','',  '',pl[2]]];
  }
  if(st>=2){
    g.hbands=[{y1:lo,y2:hi,c:RED,op:0.14}];
    var gd=[[x2,y2,'y',null,FV(y2)]];
    if(y1!==y2) gd.push([x1,y1,'y',null,FV(y1)]);
    g.guides=gd;
  }
  return g;
}

/* ===== 7 放物線と直線の交点の座標 ===== */
(function(){
function NM(n){ return n<0?'−'+(-n):String(n); }
function pt(x,y){ return '('+NM(x)+', '+NM(y)+')'; }
function pe(a){ return a===1?'x²':'−x²'; }
function mx(m){ return m===1?'x':(m===-1?'−x':NM(m)+'x'); }
function rhs(m,k){ return mx(m)+(k>0?' ＋ '+k:(k<0?' − '+(-k):'')); }
function le(m,k){ return 'y ＝ '+rhs(m,k); }
function quad(c1,c2){
  var s='x²';
  if(c1) s+=(c1>0?' ＋ ':' − ')+(Math.abs(c1)===1?'':Math.abs(c1))+'x';
  if(c2) s+=(c2>0?' ＋ ':' − ')+Math.abs(c2);

}
function fac(r){ return r>0?'(x − '+r+')':'(x ＋ '+(-r)+')'; }
function roundUp(v,s){ return Math.ceil(v/s-1e-9)*s; }
function roundDn(v,s){ return Math.floor(v/s+1e-9)*s; }

/* a(=±1)、直線 y＝mx＋k、交点の x座標 x1＜x2 から、すべての値を作る（式が成り立たなければエラー） */
function mk(a,m,k,x1,x2){
  var o={a:a,m:m,k:k,x1:x1,x2:x2,y1:a*x1*x1,y2:a*x2*x2};
  if(o.y1!==m*x1+k||o.y2!==m*x2+k) throw new Error('u06 交点が合いません '+a+' '+m+' '+k+' '+x1+' '+x2);
  o.c1=-(x1+x2); o.c2=x1*x2;
  o.curveL='y ＝ '+pe(a); o.lineL=le(m,k);
  o.facs=fac(x1)+fac(x2);
  return o;
}
/* 図の範囲を自動で決める */
function range(o){
  var xlo=Math.min(o.x1,o.x2,0)-1.5, xhi=Math.max(o.x1,o.x2,0)+1.5;
  var ylo=Math.min(o.y1,o.y2,o.k,0)-1, yhi=Math.max(o.y1,o.y2,o.k,0)+1;
  var ys=1, xsv=1, steps=[1,2,4,5,10];
  for(var i=0;i<steps.length;i++){ ys=steps[i]; if((yhi-ylo)/ys<=13) break; }
  if(xhi-xlo>13) xsv=2;
  return {xmin:roundDn(xlo,xsv),xmax:roundUp(xhi,xsv),ymin:roundDn(ylo,ys),ymax:roundUp(yhi,ys),xs:xsv,ys:ys};
}
/* 図：放物線＋直線。lab:'none'|'name'|'coord'、gd:''|'x'|'xy' */
function gAB(o,lab,gd,extra){
  var r=range(o), g={xmin:r.xmin,xmax:r.xmax,ymin:r.ymin,ymax:r.ymax,xs:r.xs,ys:r.ys};
  var side=(Math.abs(o.x1)>=Math.abs(o.x2))?-1:1;
  var lx=side*Math.sqrt(Math.max(0.78*(o.a>0?r.ymax:-r.ymin),1));
  if(lx>r.xmax-0.8) lx=r.xmax-0.8; if(lx<r.xmin+0.8) lx=r.xmin+0.8;
  g.curves=[{a:o.a,l:o.curveL,lp:[lx,o.a*lx*lx]}];
  var mid=(o.x1+o.x2)/2+1.3; g.lines=[{a:o.m,b:o.k,l:o.lineL,lp:[mid,o.m*mid+o.k]}];
  var up=o.a>0;
  var pA=up?'ul':'dl', pB=up?'ur':'dr';
  if(lab==='name'){ g.ic=[[o.x1,o.y1,'A','','',pA],[o.x2,o.y2,'B','','',pB]]; }
  else if(lab==='coord'){ g.ic=[[o.x1,o.y1,'A'+pt(o.x1,o.y1),'','',pA],[o.x2,o.y2,'B'+pt(o.x2,o.y2),'','',pB]]; }
  if(gd){ g.guides=[[o.x1,o.y1,gd],[o.x2,o.y2,gd]]; }
  if(extra) for(var q in extra) g[q]=extra[q];

}
function G(o,lab,gd,extra){ return gAB(o,lab,gd,extra); }

/* 候補の組（かけて c2 になる2数）の一覧 */
function pairsHtml(o){
  var out=[], d, e, lines=[];

  }

}
function rootsRev(o){ return NM(-o.x1)+' と '+NM(-o.x2); }

  s.push({t:'<b>答え：A'+A+'、B'+B+'</b>',g:G(o,'coord','xy')});

}
/* 選択肢つきの問題（A、B の座標を答える） */
function Qab(o,withEg){

}

/* y＝m x² 上の2点 A(p, m p²)、B(q, m q²) を結ぶ直線と傾きの三角形。ラベルは opt で指定できる */
function chord(m,p,q,base,opt){
  opt=opt||{};
  var ya=m*p*p, yb=m*q*q, k=(yb-ya)/(q-p), c0=ya-k*p;
  var g=Object.assign({},base);
  g.curves=[{a:m}];
  g.lines=[{a:k,b:c0,c:BL,x1:Math.min(p,q)-0.7,x2:Math.max(p,q)+0.7}];
  g.polys=[{p:[[p,ya],[q,ya],[q,yb]],c:GR,op:0.16,w:1.5}];
  g.segs=[
    {f:[p,ya],t:[q,ya],c:GR,l:opt.xl||('x の増加量 '+sg(q-p)),lo:opt.xlo||[0,17],la:'middle'},
    {f:[q,ya],t:[q,yb],c:RD,l:opt.yl||('y の増加量 '+sg(yb-ya)),lo:opt.ylo||[8,0],la:'start'}
  ];
  g.pts=[[p,ya,opt.la||('A('+sg(p)+', '+sg(ya)+')'),null,'',opt.pa||'ul'],[q,yb,opt.lb||('B('+sg(q)+', '+sg(yb)+')'),null,'',opt.pb||'ul']];
  if(opt.ct) g.txt=[{x:opt.ct[0],y:opt.ct[1],t:opt.ct[2],c:OR,s:13.5}];
  return g;
}
/* 一次関数 y＝k x と傾きの三角形 */
function lin(k,p,q,base,opt){
  opt=opt||{};
  var g=Object.assign({},base);
  g.lines=[{a:k,b:0,c:BL,lp:opt.lp,l:opt.l}];
  g.polys=[{p:[[p,k*p],[q,k*p],[q,k*q]],c:GR,op:0.16,w:1.5}];
  g.segs=[{f:[p,k*p],t:[q,k*p],c:GR,l:opt.xl||('x の増加量 '+(q-p)),lo:[0,17],la:'middle'},{f:[q,k*p],t:[q,k*q],c:RD,l:opt.yl||('y の増加量 '+sg(k*(q-p))),lo:[8,0],la:'start'}];
  g.pts=[[p,k*p,'('+p+', '+sg(k*p)+')',null,'','ul'],[q,k*q,'('+q+', '+sg(k*q)+')',null,'','ul']];
  return g;
}

  segs.push({f:[t,lo],t:[t,hi],c:RED,w:5,l:lb.len,lo:[-9,4],la:'end'});
  g.segs=segs;
  g.pts=[[t,0,lb.P[0],'#1f6f5c','',lb.P[1]],[t,yq,lb.Q[0],'#2a6fb0','',lb.Q[1]],[t,yr,lb.R[0],'#d4561f','',lb.R[1]]];

}

function VS(t,yq,yr,lb,o){
  o=o||{};
  var lo=Math.min(yq,yr), hi=Math.max(yq,yr), segs=[], pts=[];
  if(o.rp){ /* RP を青い線分で示す（R は x軸の上） */
    segs.push({f:[t,0],t:[t,yr],c:BL,w:4,l:o.rp,lo:[-9,4],la:'end'});
  } else if(lo!==0) segs.push({f:[t,0],t:[t,lo],c:GR,dash:true,w:2.4});
  segs.push({f:[t,lo],t:[t,hi],c:RED,w:5,l:lb.len,lo:lb.lo||[-9,4],la:lb.la||'end'});
  pts.push([t,0,lb.P[0],'#1f6f5c','',lb.P[1]]);
  pts.push([t,yq,lb.Q[0],'#2a6fb0','',lb.Q[1]]);
  pts.push([t,yr,lb.R[0],'#d4561f','',lb.R[1]]);
  return {segs:segs,pts:pts};
}
function GG(base,curves,txt,vs){
  var g=Object.assign({xs:1,ys:1},base);
  g.curves=curves; g.txt=txt;
  g.segs=[]; g.pts=[];
  vs.forEach(function(v){ g.segs=g.segs.concat(v.segs); g.pts=g.pts.concat(v.pts); });
  return g;
}

function RC(t,yt,yb,lb,base,extra){
  var g=Object.assign({xs:1,ys:1},base);
  g.polys=(g.polys||[]).concat([{p:[[t,yt],[-t,yt],[-t,yb],[t,yb]],c:GRN,op:0.16}]);

    {f:[t,yt],t:[t,yb],c:RED,w:4,l:lb.ps,lo:[-8,4],la:'end'},
    {f:[-t,yb],t:[t,yb],c:GRN,w:2.4},{f:[-t,yt],t:[-t,yb],c:GRN,w:2.4}
  ];
  g.pts=[[t,yt,lb.P,OR,'','ur'],[-t,yt,lb.Q,OR,'','ul'],[-t,yb,lb.R,GRN,'',yb===0?'ul':'l'],[t,yb,lb.S,GRN,'',yb===0?'ur':'r']];
  if(extra) for(var k in extra) g[k]=extra[k];
  return g;
}

          curves:[{a:1,c:'#bbb',l:'y ＝ x²',lp:[-3.7,10.5]}],
          lines:[{a:1,b:6,c:'#2a6fb0',l:'直線 AB'},{a:k,b:0,c:(mode===1?'#1f6f5c':'#8e44ad'),dash:true,l:(mode===1?'ℓ':'y ＝ 2x'),lp:[(mode===1?4.2:4.1),(mode===1?4.2:8.2)]}],
          polys:[{p:[A,B,X],c:'#e07a1f',op:0.25}],
          pts:[[A[0],A[1],'A(−2, 4)','#1f6f5c','','ul'],[B[0],B[1],'B(3, 9)','#1f6f5c','','ur'],[0,0,'O','#555','','dr']],
          ic:[[X[0],X[1],'X','#e07a1f','','dr']]});
        info.innerHTML='△ABX の面積 ＝ <b style="color:#c0392b;font-size:1.2em">'+nf(area)+'</b>';
        note.innerHTML=(mode===1?'AB に平行な線の上で X を動かすと、<b>底辺 AB も、高さも変わらない</b>ので、面積はずっと同じです。':'AB に平行でない線の上では、X を動かすと<b>高さが変わる</b>ので、面積も変わります。');
      }
      b1.onclick=function(){ mode=1; upd(); }; b2.onclick=function(){ mode=2; upd(); };
      sl.oninput=upd; upd();
      return box;
    };
  }

  /* --- とりつけ --- */
  function unitBy(re){ for(var i=0;i<U.length;i++) if(re.test(U[i].title)) return U[i]; return null; }
  function exBy(u,re){ if(!u) return null; for(var i=0;i<u.ex.length;i++) if(re.test(u.ex[i].q)) return u.ex[i]; return u.ex[0]; }
  var u4=unitBy(/変域①/), u5=unitBy(/変域②/), u3=unitBy(/名称と性質/);
  if(u4&&u4.ex[0]) u4.ex[0].widget=domainWidget(1);
  if(u5&&u5.ex[0]) u5.ex[0].widget=domainWidget(-1);
  var e3=exBy(u3,/下に凸|上に凸/); if(e3) e3.widget=aWidget();
  var u15=unitBy(/等積変形/); var e15=exBy(u15,/△APB/); if(e15) e15.widget=eqWidget();
})();


var GROUPS=[
 {big:'【基礎編】',t:'1　二次関数とそのグラフ',s:'y ＝ ax² の表とグラフ。放物線の名前と性質',u:[0,1,2,3]},
 {t:'2　変域',s:'x の変域から y の変域を求める。ジェットコースターの高さ',u:[4,5]},
 {t:'3　放物線と直線',s:'交点の座標と、△AOB の面積',u:[6,7]},
 {big:'【応用編（私立奨学生・難関校用）】',t:'4　変化の割合',s:'m(a ＋ b) の公式で、変化の割合を求める',u:[8,9]},
 {t:'5　t でおきかえる',s:'点の座標を (t, t²) とおいて、方程式をつくる',u:[10,11,12]},
 {t:'6　正方形・長方形',s:'辺の長さを t で表して、等しいとおく',u:[13,14]},
 {t:'7　面積の問題',s:'等積変形（平行線）と、面積が半分になる点',u:[15,16]}
];

var cur=-1;
var nav=document.getElementById("nav"), main=document.getElementById("main");
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function buildExample(ex,idx){
  var box=document.createElement('div'); box.className='ex';
  var q=document.createElement('div'); q.className='q';
  q.innerHTML='<span class="tag">例題'+(idx+1)+'</span>'+fmt(ex.q);
  if(ex.g){ var qg=document.createElement('div'); qg.innerHTML=graph(ex.g); q.appendChild(qg); }
  box.appendChild(q);
  if(ex.widget) box.appendChild(ex.widget());
  var note=document.createElement('div'); note.className='cap'; note.style.textAlign='left';
  note.textContent='まず自分で考えてみましょう。ボタンを押すと、ヒントと解き方が1ステップずつ出てきます。';
  box.appendChild(note);
  var area=document.createElement('div'); box.appendChild(area);
  var btn=document.createElement('button'); btn.className='btn'; btn.textContent='STEP 1 を見る ▶';
  var prog=document.createElement('span'); prog.className='prog';
  var shown=0, n=ex.steps.length;
  btn.onclick=function(){
    if(shown>=n){ area.innerHTML=''; shown=0; btn.textContent='STEP 1 を見る ▶'; btn.className='btn'; prog.textContent=''; note.style.display=''; return; }
    var st=ex.steps[shown]; shown++;
    var d=document.createElement('div'); d.className='step';
    var label=(shown===n&&n>1)?'答え':'STEP '+shown;
    d.innerHTML='<span class="badge">'+label+'</span>'+fmt(st.t)+(st.g?graph(st.g):'');
    // 新しい図が出たら、前の図は消す
    if(st.g){ var olds=area.querySelectorAll('svg.graph'); for(var k=0;k<olds.length;k++){ olds[k].remove(); } }
    area.appendChild(d);
    note.style.display='none';
    prog.textContent=shown+' / '+n;
    if(shown>=n){ btn.textContent='最初からやり直す ↺'; btn.className='btn sub'; }
    else btn.textContent='STEP '+(shown+1)+' を見る ▶';
  };
  box.appendChild(btn); box.appendChild(prog);
  return box;
}

function buildQuiz(list,onPass){
  var wrap=document.createElement('div');
  var answered=0, right=0;
  var score=document.createElement('div'); score.className='score';
  list.forEach(function(item,i){
    var qd=document.createElement('div'); qd.className='quiz';
    var qn=document.createElement('div'); qn.className='qn';
    qn.innerHTML='問'+(i+1)+'．'+fmt(item.q);
    var figBox=document.createElement('div'); figBox.innerHTML=(item.g?graph(item.g):''); qn.appendChild(figBox);
    qd.appendChild(qn);
    var hintShown=false;
    if(item.g&&item.eg){
      var hb=document.createElement('button'); hb.className='btn sub'; hb.textContent='ヒント：図にヒントを出す ▶';
      hb.onclick=function(){ figBox.innerHTML=graph(item.eg); hb.disabled=true; hb.textContent='ヒントを図に表示しました'; hintShown=true; };
      qd.appendChild(hb);
    }
    var opts=item.o.map(function(t,k){return {t:t,ok:k===item.a};});
    shuffle(opts);
    var og=document.createElement('div'); og.className='opts';
    var fb=document.createElement('div'); fb.className='fb';
    var marks=['ア','イ','ウ','エ'];
    var btns=[];
    opts.forEach(function(op,k){
      var b=document.createElement('button');
      if(typeof op.t==='object'){ b.className='gr'; b.innerHTML=graph(op.t.g)+'<b>'+marks[k]+'</b>'; }
      else b.innerHTML='<b>'+marks[k]+'</b>　'+fmt(op.t);
      b.onclick=function(){
        btns.forEach(function(x,m){ x.disabled=true; if(opts[m].ok) x.classList.add('ok'); });
        if(!op.ok) b.classList.add('ng');
        fb.innerHTML=(op.ok?'<b style="color:var(--ok)">正解です！</b><br>':'<b style="color:var(--ng)">おしい！ もう一度、解説を読んでみましょう。</b><br>')+fmt(item.e)+(item.eg&&!hintShown?graph(item.eg):'');
        fb.classList.add('show');
        answered++; if(op.ok) right++;
        if(answered===list.length){
          score.style.display='block';
          score.textContent=list.length+'問中 '+right+'問 正解です。'+(right===list.length?(onPass?'✅ 合格！ すばらしい！ 次の単元に進みましょう。':'🎉 すばらしい！ 全問正解です。'):'まちがえた問題は、例題のステップをもう一度見直してみましょう。');
          if(right===list.length){ if(onPass) onPass(); else launchConfetti(); }
        }
      };
      btns.push(b); og.appendChild(b);
    });
    qd.appendChild(og); qd.appendChild(fb);
    wrap.appendChild(qd);
  });
  wrap.appendChild(score);
  return wrap;
}


/* ---------- 合格の記録と花吹雪 ---------- */
var PASS={};
function pkey(t){ return 'gamba_nijikansu_'+t.replace(/\s+/g,''); }
function isPass(t){ if(PASS[t]) return true; try{ return localStorage.getItem(pkey(t))==='pass'; }catch(e){ return false; } }
function markPass(t){ PASS[t]=true; try{ localStorage.setItem(pkey(t),'pass'); }catch(e){} }
function launchConfetti(){
  var colors=['#e8372d','#1a56a0','#16a34a','#d97706','#7c3aed','#ec4899','#0ea5e9','#f59e0b'];
  for(var i=0;i<120;i++){
    (function(i){
      setTimeout(function(){
        var el=document.createElement('div'); el.className='confetti-piece';
        var sz=Math.random()*10+6;
        el.style.cssText='left:'+(Math.random()*100)+'vw;width:'+sz+'px;height:'+sz+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';border-radius:50%;animation-duration:'+(Math.random()*2+2)+'s;animation-delay:0s';
        document.body.appendChild(el); setTimeout(function(){ el.remove(); },5000);
      },i*30);
    })(i);
  }
}


/* ---------- 画面 ---------- */
function go(i){ cur=i; render(); window.scrollTo(0,0); }
function renderIndex(){
  main.innerHTML='';
  var nt=document.createElement('div'); nt.className='notice';
  nt.innerHTML='見たい単元をえらんで、押してください。はじめての人は、<b>1番から順番に</b>進みましょう。各単元は「ポイント → 解説 → 例題（ステップ）→ 練習問題・確認問題 → 実践演習 → 総合確認」の順です。';
  main.appendChild(nt);
  GROUPS.forEach(function(g){
    if(g.big){ var bg=document.createElement('div'); bg.className='g-big'; bg.textContent=g.big; main.appendChild(bg); }
    var t=document.createElement('div'); t.className='g-sec'; t.innerHTML=g.t+'<span class="u-sub" style="margin-left:2px">'+g.s+'</span>'; main.appendChild(t);
    var list=document.createElement('div'); list.className='u-list';
    g.u.forEach(function(i){ if(!U[i]) return;
      var b=document.createElement('button'); b.className='u-card';
      b.innerHTML='<span class="u-no">'+(i+1)+'</span><span class="u-name">'+fmt(U[i].title.replace(/^\d+\s+/,''))+'<span class="u-sub">'+fmt(U[i].sub||'')+'</span></span>'+(isPass(U[i].title)?'<span class="u-badge">✅ 合格</span>':'')+'<span class="u-go">▶</span>';
      if(isPass(U[i].title)) b.className+=' pass';
      b.onclick=function(){go(i);};
      list.appendChild(b);
    });
    main.appendChild(list);
  });
}
function render(){
  nav.innerHTML='';
  if(cur<0){ renderIndex(); return; }
  var u=U[cur];
  main.innerHTML='';
  var tb=document.createElement('button'); tb.className='btn sub top-btn'; tb.textContent='◀ 単元一覧にもどる'; tb.onclick=function(){go(-1);}; main.appendChild(tb);
  var h=document.createElement('h2'); h.className='unit'; h.innerHTML=fmt((cur+1)+' '+u.title.replace(/^\d+\s+/,'')); main.appendChild(h);

  var pt=document.createElement('div'); pt.className='point';
  pt.innerHTML='<b class="t">ポイント</b>'+u.point.map(function(p){return '<div>'+fmt(p)+'</div>';}).join('');
  main.appendChild(pt);

  var s1=document.createElement('h3'); s1.className='sec'; s1.textContent='解説（まずはここを読みましょう）'; main.appendChild(s1);
  var ex=document.createElement('div'); ex.className='card';
  u.explain.forEach(function(p){
    if(typeof p==='string'){ var d=document.createElement('p'); d.style.margin='8px 0'; d.innerHTML=fmt(p); ex.appendChild(d); }
    else { var g=document.createElement('div'); g.innerHTML=graph(p.g)+(p.cap?'<div class="cap">'+fmt(p.cap)+'</div>':''); ex.appendChild(g); }
  });
  main.appendChild(ex);

  var s2=document.createElement('h3'); s2.className='sec'; s2.textContent='例題（ステップを見ながら、解き方を身につけましょう）'; main.appendChild(s2);
  u.ex.forEach(function(e,i){
    main.appendChild(buildExample(e,i));
    if(e.pr&&e.ck){
      var hp=document.createElement('h4'); hp.className='subq'; hp.textContent='✏️ 例題'+(i+1)+'の練習問題（2問）　答えを選んでください'; main.appendChild(hp);
      main.appendChild(buildQuiz(e.pr));
      var hc=document.createElement('h4'); hc.className='subq'; hc.textContent='📝 例題'+(i+1)+'の確認問題（2問）　全問正解で花吹雪'; main.appendChild(hc);
      main.appendChild(buildQuiz(e.ck));
    }
  });

  var s3=document.createElement('h3'); s3.className='sec'; s3.textContent='実践演習（5問）　答えを選んでください'; main.appendChild(s3);
  main.appendChild(buildQuiz(u.prac));

  var s4=document.createElement('h3'); s4.className='sec'; s4.textContent='総合確認（3問）'; main.appendChild(s4);
  main.appendChild(buildQuiz(u.check,function(){ markPass(u.title); launchConfetti(); }));

  var pg=document.createElement('div'); pg.className='pager';
  var pb=document.createElement('button'); pb.className='btn sub'; pb.textContent='◀ 前の単元';
  var nb=document.createElement('button'); nb.className='btn'; nb.textContent='次の単元 ▶';
  pb.onclick=function(){go(cur-1);}; nb.onclick=function(){go(cur+1);};
  var ib=document.createElement('button'); ib.className='btn sub'; ib.textContent='単元一覧'; ib.onclick=function(){go(-1);};
  if(cur>0) pg.appendChild(pb); else pg.appendChild(document.createElement('span'));
  pg.appendChild(ib);
  if(cur<U.length-1) pg.appendChild(nb); else pg.appendChild(document.createElement('span'));
  main.appendChild(pg);
}
render();
